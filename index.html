<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV - Vídeos</title>
    <!-- Carregando Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000; /* Fundo preto melhora o contraste na TV */
            color: #ffffff;
            overflow: hidden; /* Remove qualquer barra de rolagem (essencial para TV) */
            margin: 0;
            padding: 0;
        }

        .header-area {
            height: 8vh; /* Ocupa exatamente 8% da altura da tela */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2vw; /* Margem lateral proporcional à tela */
            background: linear-gradient(to bottom, #111827, #000000); /* Degradê sutil */
            border-bottom: 2px solid #1f2937;
        }

        .video-area {
            height: 92vh; /* Ocupa os 92% restantes da tela */
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Garante que o vídeo não seja cortado nem esticado */
            outline: none;
        }
        
        /* Ocultando controles nativos para um visual mais limpo na TV */
        video::-webkit-media-controls {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho (Título e Data/Hora) -->
    <header class="header-area">
        <h1 id="videoTitle" class="text-3xl font-bold tracking-wide text-gray-100 drop-shadow-md">
            Carregando título...
        </h1>
        <div id="clockDisplay" class="text-2xl font-semibold text-gray-300 drop-shadow-md tracking-wider">
            --/--/---- --:--
        </div>
    </header>

    <!-- Tela de Início para liberar permissões do navegador contra o bloqueio de Autoplay -->
    <div id="startOverlay" class="absolute inset-0 bg-gray-900 z-50 flex flex-col items-center justify-center cursor-pointer" onclick="startPanel()">
        <h2 class="text-4xl text-white font-bold mb-4">Painel TV Preparado</h2>
        <p class="text-gray-400 text-xl animate-pulse">Clique aqui ou aperte OK no controle para iniciar a reprodução</p>
    </div>

    <!-- Área de Reprodução de Vídeo -->
    <main class="video-area relative">
        <!-- Mudamos para iframe para evitar os bloqueios de segurança do servidor do Drive -->
        <!-- pointer-events: none impede que o foco do teclado vá pro Drive, mantendo nosso controle funcionando -->
        <iframe id="tvPlayer" allow="autoplay; fullscreen" style="width: 100%; height: 100%; border: none; pointer-events: none;"></iframe>
    </main>

    <script>
        // O player do Drive requer que informemos o tempo de cada vídeo para a troca automática
        const playlist = [
            {
                title: "Active_Drop",
                id: "1h3GjUiuCI2NcLELuc25j5qiWGma2QwmD",
                duration: 30 // ALERTA: Digite aqui o tempo exato deste vídeo em segundos!
            },
            {
                title: "V1_ESP",
                id: "14G5kGznZv0aabzoAykNoUIeWL3LB_vFW",
                duration: 30 // Mude este tempo para os segundos reais do vídeo
            },
            {
                title: "V2_ESP",
                id: "1TbgPAJxYMkncBKINiZJK59b1CvzzKnzb",
                duration: 30 // Mude este tempo para os segundos reais do vídeo
            },
            {
                title: "V3_ESP",
                id: "1OJnPwDkvv8szslvi4c3x5lJ2YpdTyP3y",
                duration: 30 // Mude este tempo para os segundos reais do vídeo
            }
        ];

        let currentIndex = 0;
        let videoTimer; // Controlador de tempo do cronômetro
        let isPanelActive = false; // Bloqueia a execução antes do clique inicial
        
        // Elementos do DOM
        const player = document.getElementById('tvPlayer');
        const titleDisplay = document.getElementById('videoTitle');
        const clockDisplay = document.getElementById('clockDisplay');
        const overlay = document.getElementById('startOverlay');

        // Função para iniciar o painel
        function startPanel() {
            overlay.style.display = 'none';
            isPanelActive = true;
            loadVideo(currentIndex);
        }

        // Função para atualizar o relógio na tela
        function updateClock() {
            const now = new Date();
            
            // Formatando a data (Ex: 23 de Set)
            const optionsDate = { day: '2-digit', month: 'short', year: 'numeric' };
            let dateStr = now.toLocaleDateString('pt-BR', optionsDate);
            dateStr = dateStr.replace('.', ''); // Remove o ponto do mês se houver
            
            // Formatando a hora (Ex: 14:30:00)
            const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const timeStr = now.toLocaleTimeString('pt-BR', optionsTime);

            clockDisplay.textContent = `${dateStr} - ${timeStr}`;
        }
        
        // Inicia o relógio imediatamente e atualiza a cada segundo
        updateClock();
        setInterval(updateClock, 1000);

        // Função para carregar e iniciar um vídeo específico
        function loadVideo(index) {
            if (!isPanelActive) return; // Não faz nada se ainda não iniciou a tela
            
            clearTimeout(videoTimer); // Limpa o cronômetro anterior para não pular vídeos rápido demais

            // Verifica limites da lista (Loop Infinito)
            if (index >= playlist.length) {
                currentIndex = 0;
            } else if (index < 0) {
                currentIndex = playlist.length - 1;
            } else {
                currentIndex = index;
            }

            const videoData = playlist[currentIndex];
            
            // Atualiza o texto da Interface
            titleDisplay.textContent = videoData.title;
            
            // Usa o link de preview do Iframe do Google Drive
            player.src = `https://drive.google.com/file/d/${videoData.id}/preview?autoplay=1&mute=1`;
            
            // Define o cronômetro para pular de vídeo baseado no tempo cadastrado lá em cima
            videoTimer = setTimeout(() => {
                loadVideo(currentIndex + 1);
            }, videoData.duration * 1000); // Multiplica por 1000 para converter segundos em milissegundos
        }

        // Controle por Teclado (Simulando controle remoto da TV)
        window.addEventListener('keydown', (event) => {
            // Permite iniciar a tela clicando ENTER ou ESPAÇO
            if (!isPanelActive && (event.key === 'Enter' || event.key === ' ')) {
                startPanel();
                return;
            }

            if (event.key === 'ArrowRight' || event.key === 'MediaTrackNext') {
                // Seta Direita: Próximo vídeo na hora
                loadVideo(currentIndex + 1);
            } else if (event.key === 'ArrowLeft' || event.key === 'MediaTrackPrevious') {
                // Seta Esquerda: Vídeo anterior na hora
                loadVideo(currentIndex - 1);
            }
            // Observação: Controle de volume foi removido porque o iframe oficial do Drive não permite mutar/desmutar via código.
        });
    </script>
</body>
</html>
