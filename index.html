<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Painel TV - Vídeos</title> <style> * { box-sizing: border-box; } html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; } body { font-family: Arial, Helvetica, sans-serif; color: #fff; } /* ========================= CABEÇALHO ========================= */ .header-area { width: 100%; height: 8vh; display: flex; align-items: center; justify-content: space-between; padding: 0 2vw; background: linear-gradient( to bottom, #111827, #000 ); border-bottom: 2px solid #1f2937; } #videoTitle { margin: 0; max-width: 70%; font-size: clamp( 20px, 2.2vw, 38px ); font-weight: 700; color: #f3f4f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } #clockDisplay { font-size: clamp( 14px, 1.5vw, 26px ); font-weight: 600; color: #d1d5db; white-space: nowrap; } /* ========================= ÁREA DO VÍDEO ========================= */ .video-area { position: relative; width: 100%; height: 92vh; display: flex; align-items: center; justify-content: center; background: #000; } #tvPlayer { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; outline: none; border: none; /* * SEM CONTROLES */ appearance: none; user-select: none; -webkit-user-select: none; } /* * Chrome / Chromium / Edge */ #tvPlayer::-webkit-media-controls { display: none !important; } #tvPlayer::-webkit-media-controls-enclosure { display: none !important; } #tvPlayer::-webkit-media-controls-panel { display: none !important; } #tvPlayer::-webkit-media-controls-play-button { display: none !important; } #tvPlayer::-webkit-media-controls-timeline { display: none !important; } #tvPlayer::-webkit-media-controls-current-time-display { display: none !important; } #tvPlayer::-webkit-media-controls-time-remaining-display { display: none !important; } #tvPlayer::-webkit-media-controls-mute-button { display: none !important; } #tvPlayer::-webkit-media-controls-volume-slider { display: none !important; } #tvPlayer::-webkit-media-controls-fullscreen-button { display: none !important; } /* ========================= TELA INICIAL ========================= */ #startOverlay { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; cursor: pointer; background: radial-gradient( circle at center, #111827 0%, #030712 70%, #000 100% ); } #startOverlay h2 { margin: 0 0 18px; font-size: clamp( 28px, 4vw, 58px ); } #startOverlay p { margin: 0; font-size: clamp( 15px, 1.8vw, 25px ); color: #9ca3af; } /* ========================= STATUS / ERRO ========================= */ #statusMessage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; text-align: center; z-index: 30; width: 90%; } #statusMessage strong { display: block; font-size: 24px; margin-bottom: 10px; } #statusMessage span { color: #9ca3af; } /* ========================= FULLSCREEN ========================= */ :fullscreen { background: #000; } :-webkit-full-screen { background: #000; } </style> </head> <body> <!-- ========================= CABEÇALHO ========================= --> <header class="header-area"> <h1 id="videoTitle"> Preparando... </h1> <div id="clockDisplay"> --/--/---- --:--:-- </div> </header> <!-- ========================= PLAYER ========================= --> <main class="video-area"> <video id="tvPlayer" autoplay muted playsinline preload="auto" controlslist="nodownload noplaybackrate nofullscreen" disablepictureinpicture> </video> <div id="statusMessage"> <strong>Não foi possível reproduzir este vídeo</strong> <span>Tentando o próximo...</span> </div> </main> <!-- ========================= TELA INICIAL ========================= --> <div id="startOverlay" onclick="startPanel()"> <h2> Painel TV Preparado </h2> <p> Clique aqui ou aperte OK no controle para iniciar </p> </div> <script> /* ===================================================== PLAYLIST ===================================================== */ const playlist = [ { title: "Active_Drop", id: "1h3GjUiuCI2NcLELuc25j5qiWGma2QwmD" }, { title: "V1_ESP", id: "14G5kGznZv0aabzoAykNoUIeWL3LB_vFW" }, { title: "V2_ESP", id: "1TbgPAJxYMkncBKINiZJK59b1CvzzKnzb" }, { title: "V3_ESP", id: "1OJnPwDkvv8szslvi4c3x5lJ2YpdTyP3y" } ]; /* ===================================================== VARIÁVEIS ===================================================== */ let currentIndex = 0; let isPanelActive = false; let isLoadingVideo = false; let errorTimer = null; /* ===================================================== ELEMENTOS ===================================================== */ const player = document.getElementById("tvPlayer"); const titleDisplay = document.getElementById("videoTitle"); const clockDisplay = document.getElementById("clockDisplay"); const overlay = document.getElementById("startOverlay"); const statusMessage = document.getElementById("statusMessage"); /* ===================================================== URL DO GOOGLE DRIVE ===================================================== */ function getDriveVideoUrl(id) { return ( "https://drive.usercontent.google.com/download" + "?id=" + encodeURIComponent(id) + "&export=download" ); } /* ===================================================== INICIAR PAINEL ===================================================== */ async function startPanel() { if (isPanelActive) { return; } isPanelActive = true; overlay.style.display = "none"; /* * Tenta abrir em tela cheia. * O clique inicial permite essa solicitação * na maioria dos navegadores/TVs. */ try { if ( !document.fullscreenElement && document.documentElement.requestFullscreen ) { await document.documentElement.requestFullscreen(); } } catch (error) { console.warn( "Fullscreen não disponível:", error ); } loadVideo(currentIndex); } /* ===================================================== CARREGAR VÍDEO ===================================================== */ function loadVideo(index) { if (!isPanelActive) { return; } if (isLoadingVideo) { return; } isLoadingVideo = true; clearTimeout(errorTimer); /* * LOOP DA PLAYLIST */ if (index >= playlist.length) { currentIndex = 0; } else if (index < 0) { currentIndex = playlist.length - 1; } else { currentIndex = index; } const videoData = playlist[currentIndex]; /* * Atualiza título. */ titleDisplay.textContent = videoData.title; /* * Limpa estado de erro. */ statusMessage.style.display = "none"; /* * Para reprodução anterior. */ player.pause(); /* * Remove a fonte anterior. */ player.removeAttribute("src"); player.load(); /* * Nova fonte. */ player.src = getDriveVideoUrl( videoData.id ); /* * Configuração TV */ player.autoplay = true; player.muted = true; player.playsInline = true; /* * Começa carregamento. */ player.load(); /* * Libera a trava rapidamente. */ setTimeout(() => { isLoadingVideo = false; }, 300); } /* ===================================================== QUANDO PODE COMEÇAR ===================================================== */ player.addEventListener( "canplay", async () => { if (!isPanelActive) { return; } try { player.muted = true; await player.play(); } catch (error) { console.warn( "Autoplay bloqueado:", error ); } } ); /* ===================================================== FINAL DO VÍDEO ===================================================== */ player.addEventListener( "ended", () => { /* * NÃO EXISTE MAIS: * * duration: 30 * * NÃO EXISTE MAIS setTimeout * * O próprio vídeo informa exatamente * quando terminou. */ loadVideo( currentIndex + 1 ); } ); /* ===================================================== ERRO ===================================================== */ player.addEventListener( "error", () => { console.error( "Erro no vídeo:", playlist[currentIndex] ); statusMessage.style.display = "block"; clearTimeout(errorTimer); errorTimer = setTimeout(() => { statusMessage.style.display = "none"; loadVideo( currentIndex + 1 ); }, 2000); } ); /* ===================================================== RELÓGIO ===================================================== */ function updateClock() { const now = new Date(); const dateOptions = { day: "2-digit", month: "short", year: "numeric" }; let date = now.toLocaleDateString( "pt-BR", dateOptions ); date = date.replace( ".", "" ); const time = now.toLocaleTimeString( "pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" } ); clockDisplay.textContent = `${date} - ${time}`; } updateClock(); setInterval( updateClock, 1000 ); /* ===================================================== CONTROLE REMOTO / TECLADO ===================================================== */ window.addEventListener( "keydown", (event) => { /* * ENTER / OK */ if ( !isPanelActive && ( event.key === "Enter" || event.key === " " ) ) { event.preventDefault(); startPanel(); return; } /* * PRÓXIMO */ if ( event.key === "ArrowRight" || event.key === "MediaTrackNext" ) { event.preventDefault(); loadVideo( currentIndex + 1 ); return; } /* * ANTERIOR */ if ( event.key === "ArrowLeft" || event.key === "MediaTrackPrevious" ) { event.preventDefault(); loadVideo( currentIndex - 1 ); return; } } ); /* ===================================================== PROTEÇÕES PARA TV ===================================================== */ document.addEventListener( "contextmenu", event => event.preventDefault() ); document.addEventListener( "dragstart", event => event.preventDefault() ); player.addEventListener( "click", event => event.preventDefault() ); </script> </body> </html>
