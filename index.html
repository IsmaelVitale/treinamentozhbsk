<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV - Drive Player</title>
  
  <!-- Carregando Tailwind via CDN para um design rápido, moderno e 100% em um só arquivo -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none; /* Previne seleção acidental de texto com o controle remoto */
      outline: none; /* Remove a borda padrão de foco do navegador */
    }

    body {
      background-color: #0b1120;
      color: #f8fafc;
      overflow-x: hidden;
      overflow-y: hidden; /* Na TV é melhor não ter barra de rolagem geral, navegamos por foco */
    }

    /* Ocultar barra de rolagem visualmente, mas permitir scroll por código/foco se necessário */
    ::-webkit-scrollbar {
      display: none;
    }
    html {
      scrollbar-width: none;
    }

    .tv-focusable {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center center;
      border: 3px solid transparent;
    }

    .tv-focusable:focus,
    .tv-focusable.active-focus {
      transform: scale(1.05);
      border-color: #38bdf8; /* Azul claro para alto contraste na TV */
      background-color: #1e293b;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.3), 0 20px 25px -5px rgba(0, 0, 0, 0.7);
      z-index: 20;
    }

    /* Efeito sutil de pulsão para o card ativo (em reprodução) */
    .playing-pulse {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col p-6 sm:p-10 bg-slate-950 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

  <header class="flex items-center justify-between pb-6 flex-shrink-0 border-b border-slate-800/50">
    <div class="flex items-center space-x-5">
      <!-- Ícone/Logo -->
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white">DriveTV Hub</h1>
        <p class="text-slate-400 font-medium tracking-wide">Streaming Direto da Nuvem</p>
      </div>
    </div>

    <!-- Indicador de botões do controle -->
    <div class="hidden md:flex items-center space-x-4 bg-slate-900/60 backdrop-blur-md px-6 py-3 rounded-2xl border border-slate-800">
      <div class="flex items-center space-x-2">
        <span class="bg-slate-800 text-sky-400 px-3 py-1 rounded-lg text-sm font-bold shadow-inner">Setas</span>
        <span class="text-slate-300 text-sm font-semibold">Navegar</span>
      </div>
      <div class="w-px h-6 bg-slate-700"></div>
      <div class="flex items-center space-x-2">
        <span class="bg-slate-800 text-sky-400 px-3 py-1 rounded-lg text-sm font-bold shadow-inner">OK</span>
        <span class="text-slate-300 text-sm font-semibold">Reproduzir</span>
      </div>
      <div class="w-px h-6 bg-slate-700"></div>
      <div class="flex items-center space-x-2">
        <span class="bg-slate-800 text-sky-400 px-3 py-1 rounded-lg text-sm font-bold shadow-inner">Espaço</span>
        <span class="text-slate-300 text-sm font-semibold">Pausar</span>
      </div>
    </div>
  </header>

  <main class="flex-1 flex flex-col xl:flex-row gap-8 mt-8 overflow-hidden h-full">
    
    <!-- Player Principal em Destaque -->
    <section class="flex-shrink-0 w-full xl:w-2/3 max-h-[60vh] xl:max-h-none xl:h-full relative flex items-center justify-center">
      <div id="playerWrapper" class="w-full h-full bg-black rounded-3xl overflow-hidden shadow-2xl border border-slate-800 relative group">
        
        <!-- Elemento de Vídeo HTML5 -->
        <video id="tvPlayer" class="w-full h-full object-contain" controls autoplay playsinline preload="auto">
          <!-- A URL de streaming será injetada via JavaScript -->
        </video>
        
        <!-- Overlay de Carregamento (Feedback visual importante para streams pesados) -->
        <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-300 z-10 hidden">
          <svg class="animate-spin -ml-1 mr-3 h-12 w-12 text-sky-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-sky-400 font-bold text-xl tracking-wider">Conectando ao Google Drive...</span>
        </div>
      </div>
    </section>

    <section class="flex-1 flex flex-col bg-slate-900/40 rounded-3xl p-6 border border-slate-800/50 min-h-0">
      <h2 class="text-2xl font-bold text-slate-200 mb-6 flex items-center space-x-3">
        <svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        <span>Sua Biblioteca</span>
      </h2>
      
      <!-- Container com rolagem para as capas (focado para as setas na TV) -->
      <div id="playlistGrid" class="flex-1 overflow-y-auto pr-2 grid grid-cols-1 sm:grid-cols-2 gap-4 pb-10">
        <!-- Os cards serão gerados aqui dinamicamente -->
      </div>
    </section>

  </main>

  <script>
    
    // ATENÇÃO: Seu vídeo original configurado com a ID correta do Drive.
    // O endpoint `lh3.googleusercontent.com` faz o bypass do HTML padrão do Drive 
    // e retorna diretamente o stream de dados do vídeo para a tag <video>.
    const driveVideos = [
      {
        title: "V1_ESP_1_languages",
        id: "14G5kGznZv0aabzoAykNoUIeWL3LB_vFW",
        thumbnailText: "01", // Um número ou letra para ficar bonito caso não tenhamos uma capa de imagem real
        desc: "Vídeo sincronizado do Drive"
      }
      // Para adicionar mais:
      // ,{ title: "Vídeo 2", id: "ID_DO_DRIVE_AQUI", thumbnailText: "02", desc: "..." }
    ];

    let currentIndex = 0;
    
    const player = document.getElementById('tvPlayer');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const playlistGrid = document.getElementById('playlistGrid');

    // Função vital para converter ID do drive em link direto de streaming
    function getStreamUrl(fileId) {
      return `https://lh3.googleusercontent.com/d/${fileId}`;
    }

    function renderPlaylist() {
      playlistGrid.innerHTML = '';
      
      driveVideos.forEach((vid, index) => {
        // Criamos os cards com botões focáveis via tabindex="0" (Crucial para TV)
        const card = document.createElement('button');
        card.className = 'tv-focusable flex flex-col text-left bg-slate-800/80 rounded-2xl p-4 gap-4 w-full cursor-pointer overflow-hidden';
        card.setAttribute('tabindex', '0');
        card.setAttribute('data-index', index);

        // Estrutura interna do Card: Capa fictícia e Textos
        card.innerHTML = `
          <div class="relative w-full aspect-video bg-slate-900 rounded-xl flex items-center justify-center border border-slate-700/50 shadow-inner overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-tr from-sky-900/40 to-transparent"></div>
            <span class="text-4xl font-black text-slate-700">${vid.thumbnailText}</span>
            <div class="status-badge absolute top-3 right-3 bg-sky-500 text-white text-xs font-bold px-2 py-1 rounded-md hidden">
              EM REPRODUÇÃO
            </div>
            <div class="play-icon-overlay absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 transition-opacity">
               <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
            </div>
          </div>
          <div class="flex flex-col">
            <h3 class="text-lg font-bold text-slate-100 truncate w-full">${vid.title}</h3>
            <p class="text-sm text-slate-400 mt-1 truncate w-full">${vid.desc}</p>
          </div>
        `;

        // Lidar com clique do mouse ou toque
        card.addEventListener('click', () => loadAndPlay(index));
        playlistGrid.appendChild(card);
      });
      
      updateHighlightUI();
    }

    function updateHighlightUI() {
      const cards = playlistGrid.querySelectorAll('button');
      
      cards.forEach((card, idx) => {
        const badge = card.querySelector('.status-badge');
        
        if (idx === currentIndex) {
          card.classList.add('border-sky-500', 'bg-slate-800');
          card.classList.remove('border-transparent', 'bg-slate-800/80');
          badge.classList.remove('hidden');
        } else {
          card.classList.remove('border-sky-500', 'bg-slate-800');
          card.classList.add('border-transparent', 'bg-slate-800/80');
          badge.classList.add('hidden');
        }
      });
    }

    function loadAndPlay(index) {
      if (index < 0 || index >= driveVideos.length) return;
      
      currentIndex = index;
      const targetVideo = driveVideos[currentIndex];
      
      // Mostrar overlay de loading enquanto o navegador resolve a conexão com o Google Drive
      loadingOverlay.classList.remove('hidden');
      
      // Atualiza a fonte do player nativo
      player.src = getStreamUrl(targetVideo.id);
      
      // Atualiza a visualização
      updateHighlightUI();

      // Tenta reproduzir. Se falhar, é erro de autoplay sem interação prévia.
      player.play().catch(err => {
        console.warn('Interação do usuário necessária para iniciar reprodução:', err);
        loadingOverlay.classList.add('hidden'); // Oculta loading se não deu play automático
      });
    }

    // Eventos do Elemento de Vídeo
    player.addEventListener('playing', () => {
      // Quando começa a rodar de fato, escondemos o aviso de carregamento
      loadingOverlay.classList.add('hidden');
    });

    player.addEventListener('waiting', () => {
      // Se houver buffer lento, mostramos loading novamente
      loadingOverlay.classList.remove('hidden');
    });

    player.addEventListener('ended', () => {
      // Pula para o próximo vídeo quando terminar
      let nextIndex = currentIndex + 1;
      if (nextIndex >= driveVideos.length) {
        nextIndex = 0; // Loop na playlist se chegou no fim
      }
      loadAndPlay(nextIndex);
    });

    // Essa é a mágica para a Smart TV. Mapeia as setas direcionais para trocar o foco (focus())
    // entre o player e a lista de vídeos, imitando nativamente o controle de TV.
    
    document.addEventListener('keydown', (e) => {
      // Coletamos todos os elementos que podem receber foco
      const focusables = Array.from(document.querySelectorAll('.tv-focusable, video'));
      const activeElement = document.activeElement;
      
      let currentIndexFocus = focusables.indexOf(activeElement);

      // Tratamento especial para atalhos globais de mídia
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault(); // Impede o scroll de tela indesejado
        if (player.paused) player.play();
        else player.pause();
        return;
      }

      switch (e.key) {
        case 'ArrowDown':
        case 'ArrowRight':
          e.preventDefault();
          if (currentIndexFocus === -1) {
             focusables[0].focus();
          } else if (currentIndexFocus < focusables.length - 1) {
            focusables[currentIndexFocus + 1].focus();
          }
          break;
          
        case 'ArrowUp':
        case 'ArrowLeft':
          e.preventDefault();
          if (currentIndexFocus > 0) {
            focusables[currentIndexFocus - 1].focus();
          }
          break;

        case 'Enter':
          // Se estiver focado no vídeo e apertar enter, pausa/despausa
          if (activeElement === player) {
            e.preventDefault();
            if (player.paused) player.play();
            else player.pause();
          }
          break;
          
        case 'Escape':
        case 'Back': // Botão de voltar do controle de várias TVs Tizen/WebOS
          if (document.fullscreenElement) {
             document.exitFullscreen();
          }
          break;
      }
    });

    // Iniciar a aplicação
    window.addEventListener('DOMContentLoaded', () => {
      renderPlaylist();
      
      if (driveVideos.length > 0) {
        // Carrega o primeiro, mas não força Play agressivo ainda (boas práticas web)
        player.src = getStreamUrl(driveVideos[0].id);
        
        // Colocamos o foco inicial na playlist para o usuário já apertar OK no controle e começar
        setTimeout(() => {
          const firstCard = playlistGrid.querySelector('.tv-focusable');
          if (firstCard) firstCard.focus();
        }, 100);
      }
    });
  </script>
</body>
</html>
