<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel TV</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #fff;
        }

        /* ==============================
           CABEÇALHO
        ============================== */

        .header {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 8vh;

            z-index: 20;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 0 2vw;

            background:
                linear-gradient(
                    to bottom,
                    rgba(17, 24, 39, .98),
                    rgba(0, 0, 0, .90)
                );

            border-bottom:
                2px solid
                rgba(255,255,255,.08);

            /*
             * Não interfere no player.
             */
            pointer-events: none;
        }

        #videoTitle {
            margin: 0;

            max-width: 70vw;

            font-size:
                clamp(
                    18px,
                    2.2vw,
                    38px
                );

            font-weight: 700;

            color: #fff;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.8);
        }

        #clockDisplay {
            font-size:
                clamp(
                    14px,
                    1.4vw,
                    25px
                );

            font-weight: 600;

            color: #ddd;

            white-space: nowrap;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.8);
        }

        /* ==============================
           PLAYER
        ============================== */

        .video-area {
            position: fixed;

            top: 8vh;
            left: 0;

            width: 100vw;
            height: 92vh;

            background: #000;

            overflow: hidden;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        #player iframe {
            width: 100% !important;
            height: 100% !important;

            border: 0 !important;
        }

        /* ==============================
           TELA INICIAL
        ============================== */

        #startOverlay {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            cursor: pointer;

            background:
                radial-gradient(
                    circle at center,
                    #111827 0%,
                    #030712 70%,
                    #000 100%
                );
        }

        #startOverlay h1 {
            margin:
                0 0 20px;

            font-size:
                clamp(
                    28px,
                    4vw,
                    60px
                );
        }

        #startOverlay p {
            margin: 0;

            font-size:
                clamp(
                    15px,
                    1.8vw,
                    26px
                );

        }

    </style>
</head>


<body>

    <!-- ==============================
         TÍTULO / RELÓGIO
    ============================== -->

    <header class="header">

        <h1 id="videoTitle">
            Active_Drop
        </h1>

        <div id="clockDisplay">
            --/--/---- --:--:--
        </div>

    </header>


    <!-- ==============================
         PLAYER
    ============================== -->

    <main class="video-area">

        <div id="player"></div>

    </main>


    <!-- ==============================
         INÍCIO
    ============================== -->

    <div
        id="startOverlay"
        onclick="startPanel()">

        <h1>
            Painel TV Preparado
        </h1>

        <p>
            Clique aqui ou aperte OK no controle para iniciar
        </p>

    </div>


    <script src="https://www.youtube.com/iframe_api"></script>


    <script>

        /* ==============================
           PLAYLIST
        ============================== */

        const playlist = [

            {
                id: "-ZzPAr-u9Go",
                title: "Active_Drop"
            },

            {
                id: "E2jAXTyP3pU",
                title: "V1_ESP"
            },

            {
                id: "KaV5f_LuAOs",
                title: "V2_ESP"
            },

            {
                id: "bTioQpmxjfI",
                title: "V3_ESP"
            }

        ];


        /* ==============================
           VARIÁVEIS
        ============================== */

        let player = null;

        let playerReady = false;

        let started = false;

        let currentIndex = 0;


        /* ==============================
           ELEMENTOS
        ============================== */

        const title =
            document.getElementById(
                "videoTitle"
            );

        const clock =
            document.getElementById(
                "clockDisplay"
            );

        const overlay =
            document.getElementById(
                "startOverlay"
            );


        /* ==============================
           CRIA PLAYER
        ============================== */

        function onYouTubeIframeAPIReady() {

            player =
                new YT.Player(
                    "player",
                    {

                        width: "100%",
                        height: "100%",

                        videoId:
                            playlist[0].id,

                        playerVars: {

                            autoplay: 0,

                            controls: 0,

                            disablekb: 1,

                            fs: 0,

                            playsinline: 1,

                            rel: 0,

                            iv_load_policy: 3,

                            cc_load_policy: 0,

                            /*
                             * O domínio será o seu domínio
                             * quando você colocar este arquivo
                             * no site.
                             */
                            origin:
                                window.location.origin

                        },

                        events: {

                            onReady:
                                onPlayerReady,

                            onStateChange:
                                onPlayerStateChange,

                            onError:
                                onPlayerError

                        }

                    }
                );

        }


        /* ==============================
           PLAYER PRONTO
        ============================== */

        function onPlayerReady() {

            playerReady = true;

            player.setVolume(100);

            updateTitle();

        }


        /* ==============================
           INICIAR
        ============================== */

        async function startPanel() {

            if (started) {
                return;
            }

            started = true;

            overlay.style.display =
                "none";


            /*
             * Fullscreen da página.
             */

            try {

                if (
                    document.documentElement
                        .requestFullscreen
                ) {

                    await
                        document.documentElement
                            .requestFullscreen();

                }

            } catch (e) {

                console.log(
                    "Fullscreen não disponível."
                );

            }


            if (playerReady) {

                playCurrent();

            }

        }


        /* ==============================
           REPRODUZ VÍDEO
        ============================== */

        function playCurrent() {

            if (!playerReady) {
                return;
            }


            updateTitle();


            /*
             * SOM LIGADO
             */

            player.unMute();

            player.setVolume(100);


            /*
             * Carrega o vídeo atual.
             */

            player.loadVideoById(
                playlist[currentIndex].id
            );


            player.playVideo();

        }


        /* ==============================
           TROCA AUTOMÁTICA
        ============================== */

        function onPlayerStateChange(event) {

            /*
             * 0 = ENDED
             */

            if (
                event.data ===
                YT.PlayerState.ENDED
            ) {

                currentIndex++;


                /*
                 * Volta ao primeiro.
                 */

                if (
                    currentIndex >=
                    playlist.length
                ) {

                    currentIndex = 0;

                }


                playCurrent();

            }

        }


        /* ==============================
           ERRO
        ============================== */

        function onPlayerError(event) {

            console.error(
                "Erro YouTube:",
                event.data
            );


            /*
             * Pula para o próximo.
             */

            setTimeout(
                () => {

                    currentIndex++;

                    if (
                        currentIndex >=
                        playlist.length
                    ) {

                        currentIndex = 0;

                    }

                    playCurrent();

                },
                1500
            );

        }


        /* ==============================
           TÍTULO
        ============================== */

        function updateTitle() {

            title.textContent =
                playlist[currentIndex]
                    .title;

        }


        /* ==============================
           RELÓGIO
        ============================== */

        function updateClock() {

            const now =
                new Date();


            const date =
                now
                    .toLocaleDateString(
                        "pt-BR",
                        {
                            day: "2-digit",
                            month: "short",
                            year: "numeric"
                        }
                    )
                    .replace(".", "");


            const time =
                now
                    .toLocaleTimeString(
                        "pt-BR",
                        {
                            hour: "2-digit",
                            minute: "2-digit",
                            second: "2-digit"
                        }
                    );


            clock.textContent =
                `${date} - ${time}`;

        }


        updateClock();

        setInterval(
            updateClock,
            1000
        );


        /* ==============================
           CONTROLE REMOTO
        ============================== */

        window.addEventListener(
            "keydown",
            event => {

                /*
                 * ENTER / OK
                 */

                if (
                    !started &&
                    (
                        event.key === "Enter" ||
                        event.key === " "
                    )
                ) {

                    event.preventDefault();

                    startPanel();

                    return;

                }


                /*
                 * PRÓXIMO
                 */

                if (
                    event.key === "ArrowRight" ||
                    event.key === "MediaTrackNext"
                ) {

                    event.preventDefault();

                    currentIndex++;

                    if (
                        currentIndex >=
                        playlist.length
                    ) {

                        currentIndex = 0;

                    }

                    playCurrent();

                    return;

                }


                /*
                 * ANTERIOR
                 */

                if (
                    event.key === "ArrowLeft" ||
                    event.key === "MediaTrackPrevious"
                ) {

                    event.preventDefault();

                    currentIndex--;

                    if (
                        currentIndex < 0
                    ) {

                        currentIndex =
                            playlist.length - 1;

                    }

                    playCurrent();

                    return;

                }

            }
        );


        /* ==============================
           BLOQUEIOS
        ============================== */

        document.addEventListener(
            "contextmenu",
            e => e.preventDefault()
        );

        document.addEventListener(
            "dragstart",
            e => e.preventDefault()
        );

    </script>

</body>

</html>
