<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV - Drive Player</title>
  
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
      outline: none; /* Remove outline padrão, usaremos bordas customizadas para foco */
    }

    body {
      background-color: #0b1120;
      color: #f8fafc;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    ::-webkit-scrollbar {
      display: none;
    }
    html {
      scrollbar-width: none;
    }

    /* Estilização para o foco da TV (quando usa as setas do controle) */
    .tv-focusable {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center center;
      border: 4px solid transparent;
    }

    .tv-focusable:focus,
    .tv-focusable.active-focus {
      transform: scale(1.05);
      border-color: #38bdf8; /* Borda azul clara brilhante */
      background-color: #1e293b;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.3), 0 20px 25px -5px rgba(0, 0, 0, 0.7);
      z-index: 20;
    }

    /* Faz o Iframe ocupar todo o espaço do container perfeitamente */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #000;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col p-6 sm:p-10 bg-slate-950 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

  <header class="flex items-center justify-between pb-6 flex-shrink-0 border-b border-slate-800/50">
    <div class="flex items-center space-x-5">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white">DriveTV Hub</h1>
        <p class="text-slate-400 font-medium tracking-wide">Player Nativo do Google Drive</p>
      </div>
    </div>

    <!-- Instruções para o controle remoto da TV -->
    <div class="hidden md:flex items-center space-x-4 bg-slate-900/60 backdrop-blur-md px-6 py-3 rounded-2xl border border-slate-800">
      <div class="flex items-center space-x-2">
        <span class="bg-slate-800 text-sky-400 px-3 py-1 rounded-lg text-sm font-bold shadow-inner">Setas</span>
        <span class="text-slate-300 text-sm font-semibold">Navegar Cards</span>
      </div>
      <div class="w-px h-6 bg-slate-700"></div>
      <div class="flex items-center space-x-2">
        <span class="bg-slate-800 text-sky-400 px-3 py-1 rounded-lg text-sm font-bold shadow-inner">OK</span>
        <span class="text-slate-300 text-sm font-semibold">Carregar Vídeo</span>
      </div>
    </div>
  </header>

  <main class="flex-1 flex flex-col xl:flex-row gap-8 mt-8 overflow-hidden h-full">
    
    <!-- Player do Google Drive -->
    <section class="flex-shrink-0 w-full xl:w-2/3 max-h-[60vh] xl:max-h-none xl:h-full relative flex items-center justify-center">
      <div class="w-full h-full bg-black rounded-3xl overflow-hidden shadow-2xl border border-slate-800 relative group">
        
        <!-- Usamos Iframe em vez de <video> para garantir o carregamento direto dos servidores do Google -->
        <iframe 
          id="tvPlayerIframe" 
          allow="autoplay; fullscreen" 
          allowfullscreen 
          src="">
        </iframe>

        <!-- Loading Inicial (Some quando o usuário escolhe um vídeo) -->
        <div id="initialState" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center z-10">
          <svg class="w-20 h-20 text-slate-700 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span class="text-slate-500 font-semibold text-lg tracking-wider">Selecione um vídeo ao lado</span>
        </div>
      </div>
    </section>

    <!-- Playlist / Grid de Vídeos -->
    <section class="flex-1 flex flex-col bg-slate-900/40 rounded-3xl p-6 border border-slate-800/50 min-h-0">
      <h2 class="text-2xl font-bold text-slate-200 mb-6 flex items-center space-x-3">
        <svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
        <span>Sua Biblioteca</span>
      </h2>
      
      <div id="playlistGrid" class="flex-1 overflow-y-auto pr-2 grid grid-cols-1 gap-4 pb-10">
        <!-- Cards gerados dinamicamente via JS -->
      </div>
    </section>
  </main>

  <script>
    // IDs extraídas exatamente dos 4 links que você enviou
    const driveVideos = [
      {
        title: "Episódio 1",
        id: "1h3GjUiuCI2NcLELuc25j5qiWGma2QwmD",
        thumbnailText: "01",
        desc: "Vídeo do Google Drive"
      },
      {
        title: "V1_ESP_1_languages",
        id: "14G5kGznZv0aabzoAykNoUIeWL3LB_vFW",
        thumbnailText: "02",
        desc: "Vídeo do Google Drive"
      },
      {
        title: "Episódio 3",
        id: "1TbgPAJxYMkncBKINiZJK59b1CvzzKnzb",
        thumbnailText: "03",
        desc: "Vídeo do Google Drive"
      },
      {
        title: "Episódio 4",
        id: "1OJnPwDkvv8szslvi4c3x5lJ2YpdTyP3y",
        thumbnailText: "04",
        desc: "Vídeo do Google Drive"
      }
    ];

    let currentIndex = -1; // -1 significa que nada foi selecionado ainda
    
    const playerIframe = document.getElementById('tvPlayerIframe');
    const initialState = document.getElementById('initialState');
    const playlistGrid = document.getElementById('playlistGrid');

    // Função que cria o link embed (iframe) correto do Google Drive
    function getEmbedUrl(fileId) {
      return `https://drive.google.com/file/d/${fileId}/preview?autoplay=1`;
    }

    function renderPlaylist() {
      playlistGrid.innerHTML = '';
      
      driveVideos.forEach((vid, index) => {
        const card = document.createElement('button');
        // tabindex=0 torna o botão focável nativamente pelas setas do teclado/controle
        card.className = 'tv-focusable flex items-center text-left bg-slate-800/80 rounded-2xl p-4 gap-5 w-full cursor-pointer overflow-hidden';
        card.setAttribute('tabindex', '0');
        
        card.innerHTML = `
          <div class="relative w-24 h-16 sm:w-32 sm:h-20 flex-shrink-0 bg-slate-900 rounded-xl flex items-center justify-center border border-slate-700/50 shadow-inner overflow-hidden">
            <span class="text-2xl font-black text-slate-700">${vid.thumbnailText}</span>
            <div class="status-badge absolute inset-0 bg-sky-500/20 border-2 border-sky-500 rounded-xl hidden items-center justify-center">
              <svg class="w-8 h-8 text-sky-400 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
            </div>
          </div>
          <div class="flex flex-col flex-1 overflow-hidden">
            <h3 class="text-lg font-bold text-slate-100 truncate w-full">${vid.title}</h3>
            <p class="text-sm text-slate-400 mt-1 truncate w-full">${vid.desc}</p>
          </div>
        `;

        // Ativa o vídeo tanto pelo clique (mouse) quanto pelo enter (teclado/controle)
        card.addEventListener('click', () => loadAndPlay(index));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') loadAndPlay(index);
        });

        playlistGrid.appendChild(card);
      });
      
      updateHighlightUI();
    }

    function updateHighlightUI() {
      const cards = playlistGrid.querySelectorAll('button');
      
      cards.forEach((card, idx) => {
        const badge = card.querySelector('.status-badge');
        
        if (idx === currentIndex) {
          card.classList.add('border-sky-500', 'bg-slate-800');
          card.classList.remove('border-transparent', 'bg-slate-800/80');
          badge.classList.remove('hidden');
          badge.classList.add('flex');
        } else {
          card.classList.remove('border-sky-500', 'bg-slate-800');
          card.classList.add('border-transparent', 'bg-slate-800/80');
          badge.classList.add('hidden');
          badge.classList.remove('flex');
        }
      });
    }

    function loadAndPlay(index) {
      if (index < 0 || index >= driveVideos.length) return;
      
      currentIndex = index;
      const targetVideo = driveVideos[currentIndex];
      
      // Esconde a tela de "Selecione um vídeo"
      initialState.style.display = 'none';
      
      // Carrega o player do Google Drive dentro do Iframe
      playerIframe.src = getEmbedUrl(targetVideo.id);
      
      updateHighlightUI();
    }

    document.addEventListener('keydown', (e) => {
      // Coletamos todos os cards que podem receber foco
      const focusables = Array.from(document.querySelectorAll('.tv-focusable'));
      if (focusables.length === 0) return;

      const activeElement = document.activeElement;
      let currentIndexFocus = focusables.indexOf(activeElement);

      switch (e.key) {
        case 'ArrowDown':
        case 'ArrowRight':
          e.preventDefault();
          if (currentIndexFocus === -1) {
             focusables[0].focus(); // Se nada estiver focado, foca no primeiro
          } else if (currentIndexFocus < focusables.length - 1) {
            focusables[currentIndexFocus + 1].focus(); // Vai para o próximo
          }
          break;
          
        case 'ArrowUp':
        case 'ArrowLeft':
          e.preventDefault();
          if (currentIndexFocus > 0) {
            focusables[currentIndexFocus - 1].focus(); // Volta pro anterior
          }
          break;
      }
    });

    // Inicializar app
    window.addEventListener('DOMContentLoaded', () => {
      renderPlaylist();
      
      // Coloca o foco visual no primeiro vídeo para o usuário saber por onde começar
      setTimeout(() => {
        const firstCard = playlistGrid.querySelector('.tv-focusable');
        if (firstCard) firstCard.focus();
      }, 100);
    });
  </script>
</body>
</html>
