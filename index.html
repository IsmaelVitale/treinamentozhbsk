<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel TV</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #fff;
        }

        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .header-area {
            width: 100vw;
            height: 8vh;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 0 2vw;

            background:
                linear-gradient(
                    to bottom,
                    #111827,
                    #000
                );

            border-bottom:
                2px solid #1f2937;
        }

        #videoTitle {
            margin: 0;

            font-size:
                clamp(
                    18px,
                    2.2vw,
                    36px
                );

            font-weight: 700;

            color: #f3f4f6;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        #clockDisplay {
            font-size:
                clamp(
                    14px,
                    1.4vw,
                    25px
                );

            font-weight: 600;

            color: #d1d5db;

            white-space: nowrap;
        }

        /* =====================================================
           PLAYER
        ===================================================== */

        .video-area {
            width: 100vw;
            height: 92vh;

            background: #000;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        #youtubePlayer {
            width: 100%;
            height: 100%;

            border: 0;

            display: block;
        }

        /* =====================================================
           TELA DE INÍCIO
        ===================================================== */

        #startScreen {
            position: fixed;

            inset: 0;

            z-index: 9999;

            background:
                radial-gradient(
                    circle at center,
                    #111827 0%,
                    #030712 70%,
                    #000 100%
                );

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            cursor: pointer;

            padding: 30px;
        }

        #startScreen h1 {
            margin:
                0 0 20px;

            font-size:
                clamp(
                    28px,
                    4vw,
                    60px
                );
        }

        #startScreen p {
            margin: 0;

            color: #9ca3af;

            font-size:
                clamp(
                    15px,
                    1.8vw,
                    26px
                );
        }
    </style>
</head>


<body>

    <!-- =====================================================
         CABEÇALHO
    ===================================================== -->

    <header class="header-area">

        <h1 id="videoTitle">
            Painel TV
        </h1>

        <div id="clockDisplay">
            --/--/---- --:--:--
        </div>

    </header>


    <!-- =====================================================
         PLAYER
    ===================================================== -->

    <main class="video-area">

        <iframe
            id="youtubePlayer"
            src=""
            title="Painel TV"
            allow="autoplay; encrypted-media; fullscreen"
            allowfullscreen>
        </iframe>

    </main>


    <!-- =====================================================
         TELA INICIAL
    ===================================================== -->

    <div
        id="startScreen"
        onclick="startPanel()">

        <h1>
            Painel TV Preparado
        </h1>

        <p>
            Clique aqui ou aperte OK no controle para iniciar
        </p>

    </div>


    <script>

        /* =====================================================
           VÍDEOS
        ===================================================== */

        const videos = [
            "-ZzPAr-u9Go",
            "E2jAXTyP3pU",
            "KaV5f_LuAOs",
            "bTioQpmxjfI"
        ];


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const player =
            document.getElementById(
                "youtubePlayer"
            );

        const startScreen =
            document.getElementById(
                "startScreen"
            );


        /* =====================================================
           PLAYLIST YOUTUBE
        ===================================================== */

        /*
         * Primeiro vídeo:
         * -ZzPAr-u9Go
         *
         * Playlist:
         * -ZzPAr-u9Go
         * E2jAXTyP3pU
         * KaV5f_LuAOs
         * bTioQpmxjfI
         *
         * loop=1
         * = volta ao primeiro depois do último.
         */

        const firstVideo =
            videos[0];


        const playlist =
            videos.join(",");


        const youtubeUrl =
            "https://www.youtube.com/embed/" +
            firstVideo +
            "?" +

            "autoplay=1" +

            "&mute=1" +

            "&controls=0" +

            "&disablekb=1" +

            "&playsinline=1" +

            "&rel=0" +

            "&fs=0" +

            "&loop=1" +

            "&playlist=" +
            encodeURIComponent(
                playlist
            );


        /* =====================================================
           INICIA PLAYER
        ===================================================== */

        function startPanel() {

            startScreen.style.display =
                "none";


            /*
             * Coloca o player somente depois
             * da interação do usuário.
             */

            player.src =
                youtubeUrl;


            /*
             * Tenta fullscreen.
             */

            try {

                if (
                    document.documentElement
                        .requestFullscreen
                ) {

                    document.documentElement
                        .requestFullscreen()
                        .catch(() => {});

                }

            } catch (error) {

                console.log(
                    "Fullscreen indisponível."
                );

            }

        }


        /* =====================================================
           RELÓGIO
        ===================================================== */

        function updateClock() {

            const now =
                new Date();


            const date =
                now
                    .toLocaleDateString(
                        "pt-BR",
                        {
                            day:
                                "2-digit",

                            month:
                                "short",

                            year:
                                "numeric"
                        }
                    )
                    .replace(
                        ".",
                        ""
                    );


            const time =
                now
                    .toLocaleTimeString(
                        "pt-BR",
                        {
                            hour:
                                "2-digit",

                            minute:
                                "2-digit",

                            second:
                                "2-digit"
                        }
                    );


            document.getElementById(
                "clockDisplay"
            ).textContent =
                `${date} - ${time}`;

        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );


        /* =====================================================
           CONTROLE REMOTO
        ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                /*
                 * ENTER / OK
                 */

                if (
                    startScreen.style.display !== "none" &&
                    (
                        event.key === "Enter" ||
                        event.key === " "
                    )
                ) {

                    event.preventDefault();

                    startPanel();

                }

            }
        );


        /* =====================================================
           BLOQUEIOS
        ===================================================== */

        document.addEventListener(
            "contextmenu",
            event =>
                event.preventDefault()
        );


        document.addEventListener(
            "dragstart",
            event =>
                event.preventDefault()
        );

    </script>

</body>

</html>
