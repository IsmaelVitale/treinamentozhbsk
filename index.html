<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel TV</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #fff;
        }


        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .header {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 8vh;

            z-index: 100;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding:
                0 2vw;

            background:
                linear-gradient(
                    to bottom,
                    rgba(17, 24, 39, .97),
                    rgba(0, 0, 0, .88)
                );

            border-bottom:
                2px solid
                rgba(255,255,255,.08);

            pointer-events: none;
        }


        #videoTitle {

            margin: 0;

            max-width: 70vw;

            font-size:
                clamp(
                    18px,
                    2.2vw,
                    38px
                );

            font-weight: 700;

            color: #fff;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.8);
        }


        #clockDisplay {

            font-size:
                clamp(
                    14px,
                    1.5vw,
                    26px
                );

            font-weight: 600;

            color: #ddd;

            white-space: nowrap;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.8);
        }


        /* =====================================================
           ÁREA DO PLAYER
        ===================================================== */

        .video-area {

            position: fixed;

            left: 0;
            bottom: 0;

            width: 100vw;
            height: 92vh;

            background: #000;

            overflow: hidden;
        }


        #player {

            width: 100%;
            height: 100%;
        }


        #player iframe {

            width: 100% !important;
            height: 100% !important;

            border: 0 !important;
        }


        /* =====================================================
           TELA INICIAL
        ===================================================== */

        #startOverlay {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px;

            cursor: pointer;

            background:
                radial-gradient(
                    circle at center,
                    #111827 0%,
                    #030712 70%,
                    #000 100%
                );
        }


        #startOverlay h1 {

            margin:
                0 0 20px;

            font-size:
                clamp(
                    28px,
                    4vw,
                    60px
                );
        }


        #startOverlay p {

            margin: 0;

            color: #9ca3af;

            font-size:
                clamp(
                    15px,
                    1.8vw,
                    26px
                );
        }


        /* =====================================================
           STATUS
        ===================================================== */

        #status {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index: 200;

            display: none;

            padding:
                18px 28px;

            border-radius: 10px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .85
                );

            text-align: center;
        }

    </style>

</head>


<body>


    <!-- =====================================================
         CABEÇALHO
    ===================================================== -->

    <header class="header">

        <h1 id="videoTitle">
            Painel TV
        </h1>

        <div id="clockDisplay">
            --/--/---- --:--:--
        </div>

    </header>


    <!-- =====================================================
         PLAYER
    ===================================================== -->

    <main class="video-area">

        <div id="player"></div>

    </main>


    <!-- =====================================================
         STATUS
    ===================================================== -->

    <div id="status">

        Carregando vídeo...

    </div>


    <!-- =====================================================
         TELA INICIAL
    ===================================================== -->

    <div
        id="startOverlay"
        onclick="startPanel()"
    >

        <h1>
            Painel TV Preparado
        </h1>

        <p>
            Clique aqui ou aperte OK no controle para iniciar
        </p>

    </div>


    <!-- =====================================================
         YOUTUBE API
    ===================================================== -->

    <script src="https://www.youtube.com/iframe_api"></script>


    <script>

        /* =====================================================
           PLAYLIST
        ===================================================== */

        const playlist = [

            {
                id: "-ZzPAr-u9Go",
                title: "Active_Drop"
            },

            {
                id: "E2jAXTyP3pU",
                title: "V1_ESP"
            },

            {
                id: "KaV5f_LuAOs",
                title: "V2_ESP"
            },

            {
                id: "bTioQpmxjfI",
                title: "V3_ESP"
            }

        ];


        /* =====================================================
           VARIÁVEIS
        ===================================================== */

        let player = null;

        let playerReady = false;

        let panelStarted = false;

        let currentIndex = 0;

        let changing = false;


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const title =
            document.getElementById(
                "videoTitle"
            );

        const clock =
            document.getElementById(
                "clockDisplay"
            );

        const overlay =
            document.getElementById(
                "startOverlay"
            );

        const status =
            document.getElementById(
                "status"
            );


        /* =====================================================
           YOUTUBE API
        ===================================================== */

        function onYouTubeIframeAPIReady() {

            createPlayer();

        }


        /* =====================================================
           CRIA PLAYER
        ===================================================== */

        function createPlayer() {

            player =
                new YT.Player(
                    "player",
                    {

                        width:
                            "100%",

                        height:
                            "100%",

                        videoId:
                            playlist[0].id,

                        playerVars: {

                            /*
                             * Começa automaticamente quando
                             * liberado pelo usuário.
                             */
                            autoplay: 1,

                            /*
                             * REMOVE CONTROLES.
                             */
                            controls: 0,

                            /*
                             * Evita teclado dentro do player.
                             */
                            disablekb: 1,

                            /*
                             * Não mostrar fullscreen
                             * do player.
                             */
                            fs: 0,

                            /*
                             * Reprodução inline.
                             */
                            playsinline: 1,

                            /*
                             * Reduz vídeos relacionados.
                             */
                            rel: 0,

                            /*
                             * Não iniciar silenciado.
                             *
                             * O clique do usuário no painel
                             * será usado para liberar o áudio.
                             */
                            mute: 0

                        },

                        events: {

                            onReady:
                                onPlayerReady,

                            onStateChange:
                                onPlayerStateChange,

                            onError:
                                onPlayerError

                        }

                    }
                );

        }


        /* =====================================================
           PLAYER PRONTO
        ===================================================== */

        function onPlayerReady() {

            playerReady = true;


            /*
             * Volume inicial.
             */

            player.setVolume(100);


            /*
             * Atualiza título.
             */

            updateTitle();


            /*
             * Só toca depois que o usuário
             * iniciar o painel.
             */

            if (panelStarted) {

                startVideo();

            }

        }


        /* =====================================================
           INICIAR PAINEL
        ===================================================== */

        async function startPanel() {

            if (panelStarted) {
                return;
            }


            panelStarted = true;


            /*
             * Remove tela inicial.
             */

            overlay.style.display =
                "none";


            /*
             * Tenta fullscreen.
             */

            try {

                if (
                    document.documentElement
                        .requestFullscreen
                ) {

                    await
                        document.documentElement
                            .requestFullscreen();

                }

            } catch (error) {

                console.log(
                    "Fullscreen não disponível."
                );

            }


            /*
             * Player já pronto?
             */

            if (playerReady) {

                startVideo();

            }

        }


        /* =====================================================
           COMEÇA VÍDEO
        ===================================================== */

        function startVideo() {

            if (!playerReady) {
                return;
            }


            /*
             * Título do vídeo atual.
             */

            updateTitle();


            /*
             * Garante volume.
             */

            player.unMute();

            player.setVolume(100);


            /*
             * Carrega vídeo atual.
             */

            player.loadVideoById(
                playlist[currentIndex].id
            );


            /*
             * Inicia.
             */

            player.playVideo();

        }


        /* =====================================================
           MUDANÇA DE ESTADO
        ===================================================== */

        function onPlayerStateChange(event) {

            /*
             * Vídeo terminou.
             */

            if (
                event.data ===
                YT.PlayerState.ENDED
            ) {

                nextVideo();

            }


            /*
             * Começou a tocar.
             */

            if (
                event.data ===
                YT.PlayerState.PLAYING
            ) {

                /*
                 * Garante som.
                 */

                player.unMute();

                player.setVolume(100);


                /*
                 * Atualiza título.
                 */

                updateTitle();

            }

        }


        /* =====================================================
           PRÓXIMO
        ===================================================== */

        function nextVideo() {

            if (changing) {
                return;
            }


            changing = true;


            currentIndex++;


            /*
             * Loop infinito.
             */

            if (
                currentIndex >=
                playlist.length
            ) {

                currentIndex = 0;

            }


            updateTitle();


            /*
             * Pequena pausa técnica apenas para
             * o YouTube processar a troca.
             *
             * NÃO é espera entre vídeos.
             */

            player.loadVideoById(
                playlist[currentIndex].id
            );


            player.playVideo();


            setTimeout(
                () => {

                    changing = false;

                },
                300
            );

        }


        /* =====================================================
           ANTERIOR
        ===================================================== */

        function previousVideo() {

            if (changing) {
                return;
            }


            changing = true;


            currentIndex--;


            if (
                currentIndex < 0
            ) {

                currentIndex =
                    playlist.length - 1;

            }


            updateTitle();


            player.loadVideoById(
                playlist[currentIndex].id
            );


            player.playVideo();


            setTimeout(
                () => {

                    changing = false;

                },
                300
            );

        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        function updateTitle() {

            title.textContent =
                playlist[currentIndex]
                    .title;

        }


        /* =====================================================
           ERRO
        ===================================================== */

        function onPlayerError(event) {

            console.error(
                "Erro do YouTube:",
                event.data
            );


            /*
             * Não deixa a TV parada.
             */

            setTimeout(
                () => {

                    nextVideo();

                },
                1000
            );

        }


        /* =====================================================
           RELÓGIO
        ===================================================== */

        function updateClock() {

            const now =
                new Date();


            const date =
                now
                    .toLocaleDateString(
                        "pt-BR",
                        {
                            day:
                                "2-digit",

                            month:
                                "short",

                            year:
                                "numeric"
                        }
                    )
                    .replace(
                        ".",
                        ""
                    );


            const time =
                now
                    .toLocaleTimeString(
                        "pt-BR",
                        {
                            hour:
                                "2-digit",

                            minute:
                                "2-digit",

                            second:
                                "2-digit"
                        }
                    );


            clock.textContent =
                `${date} - ${time}`;

        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );


        /* =====================================================
           CONTROLE REMOTO
        ===================================================== */

        window.addEventListener(
            "keydown",
            event => {

                /*
                 * ENTER / OK
                 */

                if (
                    !panelStarted &&
                    (
                        event.key === "Enter" ||
                        event.key === " "
                    )
                ) {

                    event.preventDefault();

                    startPanel();

                    return;

                }


                /*
                 * PRÓXIMO
                 */

                if (
                    event.key === "ArrowRight" ||
                    event.key === "MediaTrackNext"
                ) {

                    event.preventDefault();

                    nextVideo();

                    return;

                }


                /*
                 * ANTERIOR
                 */

                if (
                    event.key === "ArrowLeft" ||
                    event.key === "MediaTrackPrevious"
                ) {

                    event.preventDefault();

                    previousVideo();

                    return;

                }

            }
        );


        /* =====================================================
           PROTEÇÕES
        ===================================================== */

        document.addEventListener(
            "contextmenu",
            event =>
                event.preventDefault()
        );


        document.addEventListener(
            "dragstart",
            event =>
                event.preventDefault()
        );

    </script>

</body>

</html>
