<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel TV</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #fff;
        }


        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .header {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 8vh;

            z-index: 100;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 0 2vw;

            background:
                linear-gradient(
                    to bottom,
                    rgba(17, 24, 39, .97),
                    rgba(0, 0, 0, .88)
                );

            border-bottom:
                2px solid
                rgba(255,255,255,.08);

            pointer-events: none;
        }


        #videoTitle {

            margin: 0;

            max-width: 70vw;

            font-size:
                clamp(
                    18px,
                    2.2vw,
                    38px
                );

            font-weight: 700;

            color: #fff;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.8);
        }


        #clockDisplay {

            font-size:
                clamp(
                    14px,
                    1.5vw,
                    26px
                );

            font-weight: 600;

            color: #ddd;

            white-space: nowrap;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.8);
        }


        /* =====================================================
           ÁREA DO PLAYER
        ===================================================== */

        .video-area {

            position: fixed;

            left: 0;
            bottom: 0;

            width: 100vw;
            height: 92vh;

            background: #000;

            overflow: hidden;
        }


        #playerContainer {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #000;
        }


        #playerContainer iframe {

            position: absolute;

            top: 0;
            left: 0;

            width: 100% !important;
            height: 100% !important;

            border: 0;

            display: block;
        }


        /* =====================================================
           BOTÕES DE NAVEGAÇÃO
        ===================================================== */

        #controls {

            position: fixed;

            left: 50%;
            bottom: 2vh;

            transform:
                translateX(-50%);

            width: 96vw;

            z-index: 500;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 8px;

            border-radius: 14px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .82
                );

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            border:
                1px solid
                rgba(255,255,255,.12);

        }


        .control-button {

            flex: 1;

            min-width: 0;

            height:
                clamp(
                    42px,
                    6vh,
                    70px
                );

            padding:
                0 clamp(
                    8px,
                    1vw,
                    20px
                );

            border: 1px solid
                rgba(255,255,255,.18);

            border-radius: 10px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .10
                );

            color: #fff;

            font-size:
                clamp(
                    11px,
                    1.2vw,
                    22px
                );

            font-weight: 700;

            cursor: pointer;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            transition:
                transform .12s ease,
                background .12s ease,
                border-color .12s ease;
        }


        .control-button:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    .18
                );

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    .35
                );

        }


        .control-button:active {

            transform:
                scale(.96);

        }


        .control-button.active {

            background:
                rgba(
                    255,
                    255,
                    255,
                    .28
                );

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    .75
                );

            box-shadow:
                0 0 12px
                rgba(
                    255,
                    255,
                    255,
                    .15
                );

        }


        .nav-button {

            flex:
                0 0 auto;

            min-width:
                clamp(
                    90px,
                    10vw,
                    170px
                );
        }


        /* =====================================================
           STATUS
        ===================================================== */

        #status {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index: 600;

            display: none;

            padding:
                18px 28px;

            border-radius: 10px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .85
                );

            text-align: center;

            font-size:
                clamp(
                    16px,
                    1.5vw,
                    24px
                );
        }


        /* =====================================================
           TELA INICIAL
        ===================================================== */

        #startOverlay {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px;

            cursor: pointer;

            background:
                radial-gradient(
                    circle at center,
                    #111827 0%,
                    #030712 70%,
                    #000 100%
                );
        }


        #startOverlay h1 {

            margin:
                0 0 20px;

            font-size:
                clamp(
                    28px,
                    4vw,
                    60px
                );
        }


        #startOverlay p {

            margin: 0;

            color: #9ca3af;

            font-size:
                clamp(
                    15px,
                    1.8vw,
                    26px
                );
        }


    </style>

</head>


<body>


    <!-- =====================================================
         CABEÇALHO
    ===================================================== -->

    <header class="header">

        <h1 id="videoTitle">
            Painel TV
        </h1>


        <div id="clockDisplay">
            --/--/---- --:--:--
        </div>

    </header>


    <!-- =====================================================
         PLAYER
    ===================================================== -->

    <main class="video-area">

        <div id="playerContainer"></div>

    </main>


    <!-- =====================================================
         CONTROLES CLICÁVEIS
    ===================================================== -->

    <nav id="controls">

        <button
            class="control-button nav-button"
            type="button"
            onclick="previousVideo()"
        >
            ◀ Anterior
        </button>


        <button
            class="control-button video-button"
            type="button"
            data-index="0"
            onclick="selectVideo(0)"
        >
            Active_Drop
        </button>


        <button
            class="control-button video-button"
            type="button"
            data-index="1"
            onclick="selectVideo(1)"
        >
            V1
        </button>


        <button
            class="control-button video-button"
            type="button"
            data-index="2"
            onclick="selectVideo(2)"
        >
            V2
        </button>


        <button
            class="control-button video-button"
            type="button"
            data-index="3"
            onclick="selectVideo(3)"
        >
            V3
        </button>


        <button
            class="control-button nav-button"
            type="button"
            onclick="nextVideo()"
        >
            Próximo ▶
        </button>

    </nav>


    <!-- =====================================================
         STATUS
    ===================================================== -->

    <div id="status">
        Carregando vídeo...
    </div>


    <!-- =====================================================
         TELA INICIAL
    ===================================================== -->

    <div
        id="startOverlay"
        onclick="startPanel()"
    >

        <h1>
            Painel TV Preparado
        </h1>


        <p>
            Clique aqui para iniciar
        </p>

    </div>


    <!-- =====================================================
         YOUTUBE IFRAME API
    ===================================================== -->

    <script src="https://www.youtube.com/iframe_api"></script>


    <script>

        /* =====================================================
           PLAYLIST
        ===================================================== */

        const playlist = [

            {
                id: "-ZzPAr-u9Go",
                title: "Active_Drop"
            },

            {
                id: "E2jAXTyP3pU",
                title: "V1"
            },

            {
                id: "KaV5f_LuAOs",
                title: "V2"
            },

            {
                id: "bTioQpmxjfI",
                title: "V3"
            }

        ];


        /* =====================================================
           VARIÁVEIS
        ===================================================== */

        let player = null;

        let playerReady = false;

        let youtubeApiReady = false;

        let panelStarted = false;

        let currentIndex = 0;

        let currentSequence = [];

        let changing = false;


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const title =
            document.getElementById(
                "videoTitle"
            );


        const clock =
            document.getElementById(
                "clockDisplay"
            );


        const overlay =
            document.getElementById(
                "startOverlay"
            );


        const status =
            document.getElementById(
                "status"
            );


        const playerContainer =
            document.getElementById(
                "playerContainer"
            );


        const videoButtons =
            document.querySelectorAll(
                ".video-button"
            );


        /* =====================================================
           YOUTUBE API PRONTA
        ===================================================== */

        function onYouTubeIframeAPIReady() {

            youtubeApiReady = true;

            console.log(
                "YouTube IFrame API carregada."
            );


            /*
             * O vídeo já pode ter sido criado
             * diretamente como iframe.
             *
             * Agora apenas tentamos conectar
             * a API ao iframe existente.
             */

            if (panelStarted) {

                attachYouTubeAPI();

            }

        }


        /* =====================================================
           INICIAR PAINEL
        ===================================================== */

        async function startPanel() {

            if (panelStarted) {
                return;
            }


            panelStarted = true;


            overlay.style.display =
                "none";


            showStatus(
                "Carregando vídeo..."
            );


            /*
             * Fullscreen é opcional.
             *
             * Se a TCL não permitir,
             * a página continua funcionando.
             */

            try {

                if (
                    document.documentElement
                        .requestFullscreen
                ) {

                    await
                        document.documentElement
                            .requestFullscreen();

                }

            } catch (error) {

                console.log(
                    "Fullscreen não disponível."
                );

            }


            /*
             * Começa sempre no Active_Drop.
             */

            currentIndex = 0;


            createIframe(
                currentIndex
            );


            updateTitle();

            updateButtons();

        }


        /* =====================================================
           CRIAR URL DO IFRAME
        ===================================================== */

        function buildYouTubeURL(
            startIndex
        ) {

            currentSequence = [];


            /*
             * Monta a ordem a partir do vídeo
             * selecionado.
             *
             * Exemplo:
             *
             * V2
             * V3
             * Active_Drop
             * V1
             */

            for (
                let i = 0;
                i < playlist.length;
                i++
            ) {

                currentSequence.push(
                    (
                        startIndex + i
                    ) %
                    playlist.length
                );

            }


            const firstVideo =
                playlist[
                    currentSequence[0]
                ].id;


            const followingVideos =
                currentSequence
                    .slice(1)
                    .map(
                        index =>
                            playlist[index].id
                    );


            const params =
                new URLSearchParams();


            /*
             * Autoplay.
             */

            params.set(
                "autoplay",
                "1"
            );


            /*
             * Sem controles internos
             * do YouTube.
             */

            params.set(
                "controls",
                "0"
            );


            /*
             * Sem teclado dentro do iframe.
             */

            params.set(
                "disablekb",
                "1"
            );


            /*
             * Não mostrar botão fullscreen
             * do próprio YouTube.
             */

            params.set(
                "fs",
                "0"
            );


            /*
             * Reprodução inline.
             */

            params.set(
                "playsinline",
                "1"
            );


            /*
             * Evita sair sugerindo vídeos
             * aleatórios de outros canais.
             */

            params.set(
                "rel",
                "0"
            );


            /*
             * Loop automático da sequência.
             *
             * O parâmetro playlist define
             * quais vídeos vêm depois do primeiro.
             */

            params.set(
                "loop",
                "1"
            );


            /*
             * Tentamos iniciar com som.
             *
             * Como o iframe é criado dentro
             * da ação do botão "iniciar",
             * há uma interação do usuário.
             */

            params.set(
                "mute",
                "0"
            );


            /*
             * Permite conexão posterior
             * da IFrame API.
             */

            params.set(
                "enablejsapi",
                "1"
            );


            /*
             * Define a playlist.
             */

            if (
                followingVideos.length > 0
            ) {

                params.set(
                    "playlist",
                    followingVideos.join(",")
                );

            }


            /*
             * Origin é recomendável quando
             * a página é servida por HTTP/HTTPS.
             */

            if (
                location.protocol ===
                    "http:" ||
                location.protocol ===
                    "https:"
            ) {

                params.set(
                    "origin",
                    location.origin
                );

            }


            return (
                "https://www.youtube.com/embed/" +
                firstVideo +
                "?" +
                params.toString()
            );

        }


        /* =====================================================
           CRIAR IFRAME
        ===================================================== */

        function createIframe(
            startIndex
        ) {

            player = null;

            playerReady = false;


            playerContainer.innerHTML =
                "";


            const iframe =
                document.createElement(
                    "iframe"
                );


            iframe.id =
                "youtubePlayer";


            iframe.src =
                buildYouTubeURL(
                    startIndex
                );


            iframe.title =
                playlist[
                    startIndex
                ].title;


            iframe.allow =
                "autoplay; encrypted-media; fullscreen; picture-in-picture";


            iframe.allowFullscreen =
                true;


            iframe.frameBorder =
                "0";


            iframe.setAttribute(
                "referrerpolicy",
                "strict-origin-when-cross-origin"
            );


            playerContainer.appendChild(
                iframe
            );


            /*
             * Atualiza imediatamente.
             *
             * Não dependemos do onReady
             * para mostrar o título.
             */

            updateTitle();

            updateButtons();


            /*
             * Esconde o "carregando" depois
             * de alguns segundos.
             */

            setTimeout(
                () => {

                    hideStatus();

                },
                3500
            );


            /*
             * Caso a API já esteja disponível,
             * tenta conectar ao iframe.
             */

            if (youtubeApiReady) {

                setTimeout(
                    attachYouTubeAPI,
                    500
                );

            }

        }


        /* =====================================================
           CONECTAR API AO IFRAME
        ===================================================== */

        function attachYouTubeAPI() {

            if (!youtubeApiReady) {
                return;
            }


            if (!panelStarted) {
                return;
            }


            const iframe =
                document.getElementById(
                    "youtubePlayer"
                );


            if (!iframe) {
                return;
            }


            try {

                player =
                    new YT.Player(
                        iframe,
                        {

                            events: {

                                onReady:
                                    onPlayerReady,

                                onStateChange:
                                    onPlayerStateChange,

                                onError:
                                    onPlayerError

                            }

                        }
                    );

            } catch (error) {

                /*
                 * IMPORTANTE:
                 *
                 * Se a API da TCL falhar,
                 * o iframe continua funcionando.
                 */

                console.warn(
                    "API YouTube indisponível; iframe continua normalmente.",
                    error
                );

                player = null;

            }

        }


        /* =====================================================
           PLAYER PRONTO
        ===================================================== */

        function onPlayerReady(
            event
        ) {

            playerReady = true;


            hideStatus();


            /*
             * O autoplay do iframe já foi solicitado.
             *
             * Tentamos garantir a reprodução
             * e o volume.
             */

            try {

                event.target.unMute();

                event.target.setVolume(
                    100
                );

                event.target.playVideo();

            } catch (error) {

                console.log(
                    "Não foi possível controlar volume/play.",
                    error
                );

            }

        }


        /* =====================================================
           MUDANÇA DE ESTADO
        ===================================================== */

        function onPlayerStateChange(
            event
        ) {

            /*
             * Tocando.
             */

            if (
                event.data ===
                YT.PlayerState.PLAYING
            ) {

                hideStatus();


                /*
                 * Descobre qual posição da
                 * sequência está sendo tocada.
                 */

                try {

                    const sequenceIndex =
                        event.target
                            .getPlaylistIndex();


                    if (
                        typeof sequenceIndex ===
                            "number" &&
                        sequenceIndex >= 0 &&
                        sequenceIndex <
                            currentSequence.length
                    ) {

                        currentIndex =
                            currentSequence[
                                sequenceIndex
                            ];


                        updateTitle();

                        updateButtons();

                    }

                } catch (error) {

                    console.log(
                        "Não foi possível obter o índice do vídeo.",
                        error
                    );

                }

            }


            /*
             * Buffering.
             */

            if (
                event.data ===
                YT.PlayerState.BUFFERING
            ) {

                showStatus(
                    "Carregando vídeo..."
                );

            }

        }


        /* =====================================================
           SELECIONAR VÍDEO
        ===================================================== */

        function selectVideo(
            index
        ) {

            if (!panelStarted) {
                return;
            }


            if (
                index < 0 ||
                index >= playlist.length
            ) {

                return;

            }


            if (changing) {
                return;
            }


            /*
             * Se já está no vídeo escolhido,
             * não faz nada.
             */

            if (
                index === currentIndex &&
                playerReady
            ) {

                return;

            }


            changing = true;


            currentIndex =
                index;


            updateTitle();

            updateButtons();


            /*
             * Sempre reconstruímos o iframe.
             *
             * Isso evita depender de
             * playVideoAt() na TCL.
             *
             * Dessa forma o mesmo mecanismo
             * que já funcionou no iframe puro
             * é utilizado para cada troca.
             */

            createIframe(
                currentIndex
            );


            setTimeout(
                () => {

                    changing = false;

                },
                800
            );

        }


        /* =====================================================
           PRÓXIMO
        ===================================================== */

        function nextVideo() {

            if (!panelStarted) {
                return;
            }


            if (changing) {
                return;
            }


            let nextIndex =
                currentIndex + 1;


            if (
                nextIndex >=
                playlist.length
            ) {

                nextIndex = 0;

            }


            selectVideo(
                nextIndex
            );

        }


        /* =====================================================
           ANTERIOR
        ===================================================== */

        function previousVideo() {

            if (!panelStarted) {
                return;
            }


            if (changing) {
                return;
            }


            let previousIndex =
                currentIndex - 1;


            if (
                previousIndex < 0
            ) {

                previousIndex =
                    playlist.length - 1;

            }


            selectVideo(
                previousIndex
            );

        }


        /* =====================================================
           ATUALIZAR TÍTULO
        ===================================================== */

        function updateTitle() {

            title.textContent =
                playlist[
                    currentIndex
                ].title;

        }


        /* =====================================================
           ATUALIZAR BOTÕES
        ===================================================== */

        function updateButtons() {

            videoButtons.forEach(
                button => {

                    const index =
                        Number(
                            button.dataset.index
                        );


                    button.classList.toggle(
                        "active",
                        index === currentIndex
                    );

                }
            );

        }


        /* =====================================================
           ERRO DO YOUTUBE
        ===================================================== */

        function onPlayerError(
            event
        ) {

            console.error(
                "Erro do YouTube:",
                event.data
            );


            /*
             * Tenta automaticamente o
             * próximo vídeo caso algum
             * conteúdo apresente erro.
             */

            setTimeout(
                () => {

                    if (
                        panelStarted &&
                        !changing
                    ) {

                        nextVideo();

                    }

                },
                1500
            );

        }


        /* =====================================================
           STATUS
        ===================================================== */

        function showStatus(
            message
        ) {

            status.textContent =
                message;

            status.style.display =
                "block";

        }


        function hideStatus() {

            status.style.display =
                "none";

        }


        /* =====================================================
           RELÓGIO
        ===================================================== */

        function updateClock() {

            const now =
                new Date();


            const date =
                now.toLocaleDateString(
                    "pt-BR",
                    {
                        day: "2-digit",
                        month: "short",
                        year: "numeric"
                    }
                )
                .replace(
                    ".",
                    ""
                );


            const time =
                now.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );


            clock.textContent =
                `${date} - ${time}`;

        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );


        /* =====================================================
           PROTEÇÕES
        ===================================================== */

        document.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

            }
        );


        document.addEventListener(
            "dragstart",
            event => {

                event.preventDefault();

            }
        );


        /*
         * NÃO existe mais keydown.
         *
         * Portanto:
         *
         * ArrowLeft
         * ArrowRight
         * MediaTrackNext
         * MediaTrackPrevious
         *
         * não controlam mais o painel.
         */

    </script>

</body>

</html>
