<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV - Vídeos</title>
    <!-- Carregando Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000; /* Fundo preto melhora o contraste na TV */
            color: #ffffff;
            overflow: hidden; /* Remove qualquer barra de rolagem (essencial para TV) */
            margin: 0;
            padding: 0;
        }

        .header-area {
            height: 8vh; /* Ocupa exatamente 8% da altura da tela */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2vw; /* Margem lateral proporcional à tela */
            background: linear-gradient(to bottom, #111827, #000000); /* Degradê sutil */
            border-bottom: 2px solid #1f2937;
        }

        .video-area {
            height: 92vh; /* Ocupa os 92% restantes da tela */
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Garante que o vídeo não seja cortado nem esticado */
            outline: none;
        }
        
        /* Ocultando controles nativos para um visual mais limpo na TV */
        video::-webkit-media-controls {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho (Título e Data/Hora) -->
    <header class="header-area">
        <h1 id="videoTitle" class="text-3xl font-bold tracking-wide text-gray-100 drop-shadow-md">
            Carregando título...
        </h1>
        <div id="clockDisplay" class="text-2xl font-semibold text-gray-300 drop-shadow-md tracking-wider">
            --/--/---- --:--
        </div>
    </header>

    <!-- Área de Reprodução de Vídeo -->
    <main class="video-area">
        <!-- Adicionado autoplay e muted. O muted é vital porque navegadores bloqueiam autoplay com som sem interação prévia -->
        <video id="tvPlayer" autoplay muted playsinline>
            Seu navegador não suporta a tag de vídeo.
        </video>
    </main>

    <script>
        // Lista de vídeos convertidos para link de download direto do Drive
        // Formato original: /file/d/ID/view
        // Formato direto: /uc?export=download&id=ID
        const playlist = [
            {
                title: "Active_Drop",
                url: "https://drive.google.com/uc?export=download&id=1h3GjUiuCI2NcLELuc25j5qiWGma2QwmD"
            },
            {
                title: "V1_ESP",
                url: "https://drive.google.com/uc?export=download&id=14G5kGznZv0aabzoAykNoUIeWL3LB_vFW"
            },
            {
                title: "V2_ESP",
                url: "https://drive.google.com/uc?export=download&id=1TbgPAJxYMkncBKINiZJK59b1CvzzKnzb"
            },
            {
                title: "V3_ESP",
                url: "https://drive.google.com/uc?export=download&id=1OJnPwDkvv8szslvi4c3x5lJ2YpdTyP3y"
            }
        ];

        let currentIndex = 0;
        
        // Elementos do DOM
        const player = document.getElementById('tvPlayer');
        const titleDisplay = document.getElementById('videoTitle');
        const clockDisplay = document.getElementById('clockDisplay');

        // Função para atualizar o relógio na tela
        function updateClock() {
            const now = new Date();
            
            // Formatando a data (Ex: 23 de Set)
            const optionsDate = { day: '2-digit', month: 'short', year: 'numeric' };
            let dateStr = now.toLocaleDateString('pt-BR', optionsDate);
            dateStr = dateStr.replace('.', ''); // Remove o ponto do mês se houver
            
            // Formatando a hora (Ex: 14:30:00)
            const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const timeStr = now.toLocaleTimeString('pt-BR', optionsTime);

            clockDisplay.textContent = `${dateStr} - ${timeStr}`;
        }
        
        // Inicia o relógio imediatamente e atualiza a cada segundo
        updateClock();
        setInterval(updateClock, 1000);

        // Função para carregar e iniciar um vídeo específico
        function loadVideo(index) {
            // Verifica limites da lista (Loop)
            if (index >= playlist.length) {
                currentIndex = 0; // Volta pro começo se passou do fim
            } else if (index < 0) {
                currentIndex = playlist.length - 1; // Vai pro último se retrocedeu do primeiro
            } else {
                currentIndex = index;
            }

            const videoData = playlist[currentIndex];
            
            // Atualiza Interface
            titleDisplay.textContent = videoData.title;
            
            // Atualiza e Toca Vídeo
            player.src = videoData.url;
            
            // Tratamento de erro caso o Drive bloqueie o carregamento
            player.play().catch(error => {
                console.warn("Autoplay impedido ou erro de carregamento:", error);
                // Você pode querer exibir uma mensagem na tela se falhar muito
                // titleDisplay.textContent = "Erro ao reproduzir. Aperte play.";
            });
        }

        // Evento: Quando o vídeo atual terminar, pula para o próximo sozinho
        player.addEventListener('ended', () => {
            loadVideo(currentIndex + 1);
        });

        // Controle por Teclado (Simulando controle remoto da TV)
        window.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight' || event.key === 'MediaTrackNext') {
                // Seta Direita: Próximo vídeo
                loadVideo(currentIndex + 1);
            } else if (event.key === 'ArrowLeft' || event.key === 'MediaTrackPrevious') {
                // Seta Esquerda: Vídeo anterior
                loadVideo(currentIndex - 1);
            } else if (event.key === ' ' || event.key === 'Enter') {
                // Espaço ou Enter: Pausar/Despausar
                if (player.paused) {
                    player.play();
                } else {
                    player.pause();
                }
            } else if (event.key === 'ArrowUp') {
                // Seta Cima: Ativar som (muitos navegadores exigem interação para liberar o som)
                player.muted = false;
                titleDisplay.textContent = videoData.title + " (Som Ativado)";
                setTimeout(() => { titleDisplay.textContent = playlist[currentIndex].title; }, 2000);
            } else if (event.key === 'ArrowDown') {
                // Seta Baixo: Mudar
                player.muted = true;
            }
        });

        // Iniciar o painel assim que a página carregar
        window.onload = () => {
            loadVideo(currentIndex);
        };
    </script>
</body>
</html>
