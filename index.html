<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel TV</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #fff;
        }


        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .header {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 8vh;

            z-index: 100;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 2vw;

            background:
                linear-gradient(
                    to bottom,
                    rgba(17, 24, 39, .97),
                    rgba(0, 0, 0, .88)
                );

            border-bottom:
                2px solid
                rgba(255,255,255,.08);

            pointer-events: none;
        }


        #videoTitle {

            margin: 0;

            max-width: 70vw;

            font-size:
                clamp(
                    18px,
                    2.2vw,
                    38px
                );

            font-weight: 700;

            color: #fff;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.8);
        }


        #clockDisplay {

            font-size:
                clamp(
                    14px,
                    1.5vw,
                    26px
                );

            font-weight: 600;

            color: #ddd;

            white-space: nowrap;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.8);
        }


        /* =====================================================
           ÁREA DO VÍDEO
        ===================================================== */

        .video-area {

            position: fixed;

            left: 0;
            bottom: 0;

            width: 100vw;
            height: 92vh;

            background: #000;

            overflow: hidden;

            z-index: 1;
        }


        #playerContainer {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #000;
        }


        #playerContainer iframe {

            position: absolute;

            top: 0;
            left: 0;

            width: 100% !important;
            height: 100% !important;

            border: 0;

            display: block;
        }


        /* =====================================================
           BOTÕES
        ===================================================== */

        #controls {

            position: fixed;

            left: 50%;

            bottom: 2vh;

            transform:
                translateX(-50%);

            width: 96vw;

            z-index: 500;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 8px;

            border-radius: 14px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .82
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .12
                );

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);
        }


        .control-button {

            flex: 1;

            min-width: 0;

            height:
                clamp(
                    42px,
                    6vh,
                    70px
                );

            padding:
                0 12px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .18
                );

            border-radius: 10px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .10
                );

            color: #fff;

            font-size:
                clamp(
                    11px,
                    1.2vw,
                    22px
                );

            font-weight: 700;

            cursor: pointer;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            transition:
                background .15s ease,
                transform .10s ease,
                border-color .15s ease;
        }


        .control-button:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    .18
                );

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    .35
                );
        }


        .control-button:active {

            transform:
                scale(.96);
        }


        .control-button.active {

            background:
                rgba(
                    255,
                    255,
                    255,
                    .28
                );

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    .75
                );
        }


        .nav-button {

            flex:
                0 0 auto;

            min-width:
                clamp(
                    90px,
                    10vw,
                    170px
                );
        }


        /* =====================================================
           STATUS
        ===================================================== */

        #status {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index: 600;

            display: none;

            padding:
                18px 28px;

            border-radius: 10px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .85
                );

            text-align: center;

            font-size:
                clamp(
                    16px,
                    1.5vw,
                    24px
                );
        }


        /* =====================================================
           TELA INICIAL
        ===================================================== */

        #startOverlay {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 30px;

            cursor: pointer;

            background:
                radial-gradient(
                    circle at center,
                    #111827 0%,
                    #030712 70%,
                    #000 100%
                );
        }


        #startOverlay h1 {

            margin:
                0 0 20px;

            font-size:
                clamp(
                    28px,
                    4vw,
                    60px
                );
        }


        #startOverlay p {

            margin: 0;

            color: #9ca3af;

            font-size:
                clamp(
                    15px,
                    1.8vw,
                    26px
                );
        }


    </style>

</head>


<body>


    <!-- =====================================================
         CABEÇALHO
    ===================================================== -->

    <header class="header">

        <h1 id="videoTitle">
            Painel TV
        </h1>


        <div id="clockDisplay">
            --/--/---- --:--:--
        </div>

    </header>


    <!-- =====================================================
         PLAYER
    ===================================================== -->

    <main class="video-area">

        <div id="playerContainer"></div>

    </main>


    <!-- =====================================================
         BOTÕES CLICÁVEIS
    ===================================================== -->

    <nav id="controls">

        <button
            class="control-button nav-button"
            type="button"
            onclick="previousVideo()"
        >
            ◀ Anterior
        </button>
    
    
        <button
            class="control-button video-button"
            type="button"
            data-index="0"
            onclick="selectVideo(0)"
        >
            Active_Drop
        </button>
    
    
        <button
            class="control-button video-button"
            type="button"
            data-index="1"
            onclick="selectVideo(1)"
        >
            V1
        </button>
    
    
        <button
            class="control-button video-button"
            type="button"
            data-index="2"
            onclick="selectVideo(2)"
        >
            V2
        </button>
    
    
        <button
            class="control-button video-button"
            type="button"
            data-index="3"
            onclick="selectVideo(3)"
        >
            V3
        </button>
    
    
        <button
            class="control-button video-button"
            type="button"
            data-index="4"
            onclick="selectVideo(4)"
        >
            Bottoms
        </button>
    
    
        <button
            class="control-button video-button"
            type="button"
            data-index="5"
            onclick="selectVideo(5)"
        >
            Soft
        </button>
    
    
        <button
            class="control-button nav-button"
            type="button"
            onclick="nextVideo()"
        >
            Próximo ▶
        </button>
    
    </nav>


    <!-- =====================================================
         STATUS
    ===================================================== -->

    <div id="status">
        Carregando vídeo...
    </div>


    <!-- =====================================================
         TELA INICIAL
    ===================================================== -->

    <div
        id="startOverlay"
        onclick="startPanel()"
    >

        <h1>
            Painel TV Preparado
        </h1>


        <p>
            Clique aqui para iniciar
        </p>

    </div>


    <!-- =====================================================
         YOUTUBE IFRAME API
    ===================================================== -->

    <script src="https://www.youtube.com/iframe_api"></script>


    <script>

        /* =====================================================
           VÍDEOS
        ===================================================== */

        const playlist = [

            {
                id: "-ZzPAr-u9Go",
                title: "Active_Drop"
            },
        
            {
                id: "E2jAXTyP3pU",
                title: "V1"
            },
        
            {
                id: "KaV5f_LuAOs",
                title: "V2"
            },
        
            {
                id: "bTioQpmxjfI",
                title: "V3"
            },
        
            {
                id: "x5wkSOmHQlo",
                title: "Bottoms"
            },
        
            {
                id: "bbJxdaKgccw",
                title: "Soft"
            }
        
        ];
        /* =====================================================
           ESTADO
        ===================================================== */

        let player = null;

        let youtubeApiReady = false;

        let playerReady = false;

        let panelStarted = false;

        let currentIndex = 0;

        let changing = false;


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const title =
            document.getElementById(
                "videoTitle"
            );


        const clock =
            document.getElementById(
                "clockDisplay"
            );


        const overlay =
            document.getElementById(
                "startOverlay"
            );


        const status =
            document.getElementById(
                "status"
            );


        const playerContainer =
            document.getElementById(
                "playerContainer"
            );


        const videoButtons =
            document.querySelectorAll(
                ".video-button"
            );


        /* =====================================================
           API YOUTUBE
        ===================================================== */

        function onYouTubeIframeAPIReady() {

            youtubeApiReady = true;

            console.log(
                "YouTube IFrame API pronta."
            );


            /*
             * Se o painel já tiver começado,
             * conecta ao iframe atual.
             */

            if (panelStarted) {

                attachPlayerAPI();

            }

        }


        /* =====================================================
           INICIAR PAINEL
        ===================================================== */

        function startPanel() {

            if (panelStarted) {
                return;
            }


            panelStarted = true;


            /*
             * Remove a tela inicial.
             */

            overlay.style.display =
                "none";


            /*
             * IMPORTANTE:
             *
             * NÃO usamos requestFullscreen().
             *
             * Portanto a página não pede
             * fullscreen para a TCL.
             */


            currentIndex = 0;


            updateTitle();

            updateButtons();


            /*
             * Cria diretamente o iframe
             * dentro da interação do usuário.
             */

            createIframe(
                currentIndex
            );

        }


        /* =====================================================
           URL DO YOUTUBE
        ===================================================== */

        function buildYouTubeURL(
            videoId
        ) {

            const params =
                new URLSearchParams();


            /*
             * Começa automaticamente.
             */

            params.set(
                "autoplay",
                "1"
            );


            /*
             * SEM controles do YouTube.
             */

            params.set(
                "controls",
                "0"
            );


            /*
             * SEM controles de teclado.
             */

            params.set(
                "disablekb",
                "1"
            );


            /*
             * SEM botão fullscreen.
             */

            params.set(
                "fs",
                "0"
            );


            /*
             * Reprodução inline.
             */

            params.set(
                "playsinline",
                "1"
            );


            /*
             * Mantém relacionados restritos
             * ao comportamento permitido pelo YouTube.
             */

            params.set(
                "rel",
                "0"
            );


            /*
             * Sem legendas forçadas.
             */

            params.set(
                "cc_load_policy",
                "0"
            );


            /*
             * Sem anotações.
             */

            params.set(
                "iv_load_policy",
                "3"
            );


            /*
             * Permite usar a API para detectar
             * PLAYING / ENDED etc.
             */

            params.set(
                "enablejsapi",
                "1"
            );


            /*
             * Quando a página estiver sendo
             * servida por HTTP/HTTPS, informa
             * sua origem ao YouTube.
             */

            if (
                location.protocol ===
                    "http:" ||
                location.protocol ===
                    "https:"
            ) {

                params.set(
                    "origin",
                    location.origin
                );

            }


            return (
                "https://www.youtube.com/embed/" +
                videoId +
                "?" +
                params.toString()
            );

        }


        /* =====================================================
           CRIAR IFRAME
        ===================================================== */

        function createIframe(
            index
        ) {

            /*
             * Bloqueia troca simultânea.
             */

            changing = true;


            /*
             * Destrói a instância anterior
             * da API, caso exista.
             */

            if (player) {

                try {

                    player.destroy();

                } catch (error) {

                    console.log(
                        "Player anterior já estava encerrado."
                    );

                }

            }


            player = null;

            playerReady = false;


            /*
             * Remove o iframe anterior.
             */

            playerContainer.innerHTML =
                "";


            /*
             * Atualiza título imediatamente.
             */

            currentIndex =
                index;


            updateTitle();

            updateButtons();


            /*
             * Cria o iframe.
             */

            const iframe =
                document.createElement(
                    "iframe"
                );


            iframe.id =
                "youtubePlayer";


            iframe.src =
                buildYouTubeURL(
                    playlist[index].id
                );


            iframe.title =
                playlist[index].title;


            /*
             * SOMENTE autoplay aqui.
             *
             * Não damos permissão de fullscreen.
             */

            iframe.allow =
                "autoplay; encrypted-media; picture-in-picture";


            iframe.frameBorder =
                "0";


            iframe.setAttribute(
                "referrerpolicy",
                "strict-origin-when-cross-origin"
            );


            playerContainer.appendChild(
                iframe
            );


            showStatus(
                "Carregando vídeo..."
            );


            /*
             * Se a API já estiver carregada,
             * conecta depois que o iframe
             * tiver sido inserido.
             */

            if (youtubeApiReady) {

                setTimeout(
                    () => {

                        attachPlayerAPI();

                    },
                    250
                );

            }


            /*
             * Libera nova navegação depois
             * de um pequeno intervalo.
             */

            setTimeout(
                () => {

                    changing = false;

                },
                700
            );

        }


        /* =====================================================
           CONECTAR API AO IFRAME
        ===================================================== */

        function attachPlayerAPI() {

            if (!youtubeApiReady) {
                return;
            }


            if (!panelStarted) {
                return;
            }


            const iframe =
                document.getElementById(
                    "youtubePlayer"
                );


            if (!iframe) {
                return;
            }


            /*
             * Evita criar duas instâncias.
             */

            if (player) {
                return;
            }


            try {

                player =
                    new YT.Player(
                        iframe,
                        {

                            events: {

                                onReady:
                                    onPlayerReady,

                                onStateChange:
                                    onPlayerStateChange,

                                onError:
                                    onPlayerError

                            }

                        }
                    );

            } catch (error) {

                console.warn(
                    "Não foi possível conectar a API.",
                    error
                );

                player = null;

            }

        }


        /* =====================================================
           PLAYER PRONTO
        ===================================================== */

        function onPlayerReady(
            event
        ) {

            /*
             * Confirma que este evento
             * pertence ao iframe atualmente
             * exibido.
             */

            const activeIframe =
                document.getElementById(
                    "youtubePlayer"
                );


            try {

                if (
                    event.target.getIframe() !==
                    activeIframe
                ) {

                    return;

                }

            } catch (error) {

                return;

            }


            playerReady = true;


            hideStatus();


            /*
             * Tentamos iniciar com som.
             *
             * O iframe foi criado como
             * consequência do clique do usuário.
             */

            try {

                event.target.unMute();

                event.target.setVolume(
                    100
                );

                event.target.playVideo();

            } catch (error) {

                console.log(
                    "Reprodução controlada pela TV.",
                    error
                );

            }

        }


        /* =====================================================
           MUDANÇA DE ESTADO
        ===================================================== */

        function onPlayerStateChange(
            event
        ) {

            /*
             * Confirma que o evento é do
             * iframe atualmente ativo.
             */

            const activeIframe =
                document.getElementById(
                    "youtubePlayer"
                );


            try {

                if (
                    event.target.getIframe() !==
                    activeIframe
                ) {

                    return;

                }

            } catch (error) {

                return;

            }


            /*
             * Tocando.
             */

            if (
                event.data ===
                YT.PlayerState.PLAYING
            ) {

                hideStatus();

                playerReady = true;

                return;

            }


            /*
             * Buffering.
             */

            if (
                event.data ===
                YT.PlayerState.BUFFERING
            ) {

                showStatus(
                    "Carregando vídeo..."
                );

                return;

            }


            /*
             * Terminou.
             *
             * Aqui fazemos o loop manual.
             */

            if (
                event.data ===
                YT.PlayerState.ENDED
            ) {

                nextVideo();

                return;

            }

        }


        /* =====================================================
           SELECIONAR VÍDEO
        ===================================================== */

        function selectVideo(
            index
        ) {

            if (!panelStarted) {
                return;
            }


            if (index < 0) {
                return;
            }


            if (
                index >=
                playlist.length
            ) {

                return;

            }


            if (changing) {
                return;
            }


            currentIndex =
                index;


            createIframe(
                currentIndex
            );

        }


        /* =====================================================
           PRÓXIMO
        ===================================================== */

        function nextVideo() {

            if (!panelStarted) {
                return;
            }


            if (changing) {
                return;
            }


            let nextIndex =
                currentIndex + 1;


            if (
                nextIndex >=
                playlist.length
            ) {

                nextIndex = 0;

            }


            selectVideo(
                nextIndex
            );

        }


        /* =====================================================
           ANTERIOR
        ===================================================== */

        function previousVideo() {

            if (!panelStarted) {
                return;
            }


            if (changing) {
                return;
            }


            let previousIndex =
                currentIndex - 1;


            if (
                previousIndex < 0
            ) {

                previousIndex =
                    playlist.length - 1;

            }


            selectVideo(
                previousIndex
            );

        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        function updateTitle() {

            title.textContent =
                playlist[
                    currentIndex
                ].title;

        }


        /* =====================================================
           BOTÃO ATIVO
        ===================================================== */

        function updateButtons() {

            videoButtons.forEach(
                button => {

                    const index =
                        Number(
                            button.dataset.index
                        );


                    button.classList.toggle(
                        "active",
                        index === currentIndex
                    );

                }
            );

        }


        /* =====================================================
           ERRO
        ===================================================== */

        function onPlayerError(
            event
        ) {

            console.error(
                "Erro do YouTube:",
                event.data
            );


            /*
             * Se algum vídeo der erro,
             * passa automaticamente ao próximo.
             */

            setTimeout(
                () => {

                    if (
                        panelStarted &&
                        !changing
                    ) {

                        nextVideo();

                    }

                },
                1500
            );

        }


        /* =====================================================
           STATUS
        ===================================================== */

        function showStatus(
            message
        ) {

            status.textContent =
                message;

            status.style.display =
                "block";

        }


        function hideStatus() {

            status.style.display =
                "none";

        }


        /* =====================================================
           RELÓGIO
        ===================================================== */

        function updateClock() {

            const now =
                new Date();


            const date =
                now.toLocaleDateString(
                    "pt-BR",
                    {
                        day: "2-digit",
                        month: "short",
                        year: "numeric"
                    }
                )
                .replace(
                    ".",
                    ""
                );


            const time =
                now.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );


            clock.textContent =
                `${date} - ${time}`;

        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );


        /* =====================================================
           INICIALIZAÇÃO
        ===================================================== */

        updateTitle();

        updateButtons();

    </script>

</body>

</html>
