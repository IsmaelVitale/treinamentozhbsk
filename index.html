<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel TV</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            color: #fff;
        }

        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .header-area {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 8vh;

            z-index: 20;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding:
                0 2vw;

            background:
                linear-gradient(
                    to bottom,
                    rgba(17, 24, 39, 0.96),
                    rgba(0, 0, 0, 0.80)
                );

            border-bottom:
                2px solid
                rgba(255, 255, 255, 0.08);

            pointer-events: none;
        }

        #videoTitle {
            margin: 0;

            max-width: 70vw;

            font-size:
                clamp(
                    18px,
                    2vw,
                    34px
                );

            font-weight: 700;

            color: #f3f4f6;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.8);
        }

        #clockDisplay {
            font-size:
                clamp(
                    14px,
                    1.4vw,
                    24px
                );

            font-weight: 600;

            color: #e5e7eb;

            white-space: nowrap;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.8);
        }

        /* =====================================================
           PLAYER
        ===================================================== */

        .video-area {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            overflow: hidden;
        }

        #player {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;
        }

        /*
         * O iframe é tratado como player da TV.
         * Não queremos interação do mouse/controle.
         */
        #player iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
        }

        /*
         * Mantém a área inteira como painel.
         */
        .tv-click-blocker {
            position: absolute;

            inset: 0;

            z-index: 10;

            background: transparent;

            cursor: default;
        }

        /* =====================================================
           TELA INICIAL
        ===================================================== */

        #startOverlay {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;

            cursor: pointer;

            background:
                radial-gradient(
                    circle at center,
                    #111827 0%,
                    #030712 68%,
                    #000 100%
                );
        }

        #startOverlay h2 {
            margin:
                0 0 18px;

            font-size:
                clamp(
                    28px,
                    4vw,
                    58px
                );
        }

        #startOverlay p {
            margin: 0;

            font-size:
                clamp(
                    15px,
                    1.8vw,
                    25px
                );

        }

        /* =====================================================
           STATUS

        #statusMessage {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index: 30;

            display: none;

            min-width: 300px;

            max-width: 80vw;

            padding:
                20px 26px;

            text-align: center;

            border-radius: 12px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.82
                );

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.5);
        }

        #statusMessage strong {
            display: block;

            font-size: 20px;

            margin-bottom: 8px;
        }

        #statusMessage span {
            color: #9ca3af;
        }

        /* =====================================================
           FULLSCREEN
        ===================================================== */

        :fullscreen {
            background: #000;
        }

        :-webkit-full-screen {
            background: #000;
        }
    </style>
</head>


<body>

    <!-- =====================================================
         CABEÇALHO
    ===================================================== -->

    <header class="header-area">

        <h1 id="videoTitle">
            Preparando...
        </h1>

        <div id="clockDisplay">
            --/--/---- --:--:--
        </div>

    </header>


    <!-- =====================================================
         PLAYER
    ===================================================== -->

    <main class="video-area">

        <div id="player"></div>

        <!--
            Camada transparente.
            Impede clique acidental no player.
        -->
        <div class="tv-click-blocker"></div>

    </main>


    <!-- =====================================================
         STATUS
    ===================================================== -->

    <div id="statusMessage">

        <strong>
            Preparando reprodução...
        </strong>

        <span>
            Aguarde.
        </span>

    </div>


    <!-- =====================================================
         TELA INICIAL
    ===================================================== -->

    <div
        id="startOverlay"
        onclick="startPanel()"
    >

        <h2>
            Painel TV Preparado
        </h2>

        <p>
            Clique aqui ou aperte OK no controle para iniciar
        </p>

    </div>


    <!-- =====================================================
         YOUTUBE IFRAME API
    ===================================================== -->

    <script src="https://www.youtube.com/iframe_api"></script>


    <script>

        /* =====================================================
           PLAYLIST
        ===================================================== */

        const playlist = [

            {
                title: "Vídeo 1",
                id: "-ZzPAr-u9Go"
            },

            {
                title: "Vídeo 2",
                id: "E2jAXTyP3pU"
            },

            {
                title: "Vídeo 3",
                id: "KaV5f_LuAOs"
            },

            {
                title: "Vídeo 4",
                id: "bTioQpmxjfI"
            }

        ];


        /* =====================================================
           VARIÁVEIS
        ===================================================== */

        let currentIndex = 0;

        let youtubePlayer = null;

        let youtubeReady = false;

        let panelActive = false;

        let changingVideo = false;


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const titleDisplay =
            document.getElementById(
                "videoTitle"
            );

        const clockDisplay =
            document.getElementById(
                "clockDisplay"
            );

        const overlay =
            document.getElementById(
                "startOverlay"
            );


        /* =====================================================
           GOOGLE / YOUTUBE API
        ===================================================== */

        function onYouTubeIframeAPIReady() {

            youtubePlayer =
                new YT.Player(
                    "player",
                    {

                        width: "100%",

                        height: "100%",

                        videoId:
                            playlist[0].id,

                        playerVars: {

                            /*
                             * Autoplay.
                             */
                            autoplay: 1,

                            /*
                             * Sem controles.
                             */
                            controls: 0,

                            /*
                             * Vídeo mudo.
                             */
                            mute: 1,

                            /*
                             * Não mostrar vídeos relacionados
                             * ao finalizar.
                             */
                            rel: 0,

                            /*
                             * Vídeo incorporado.
                             */
                            playsinline: 1,

                            /*
                             * Remove anotações.
                             */
                            iv_load_policy: 3,

                            /*
                             * Não permitir controle
                             * pelo teclado dentro do player.
                             */
                            disablekb: 1,

                            /*
                             * Não mostrar botão fullscreen
                             * do player do YouTube.
                             *
                             * O fullscreen será da página.
                             */
                            fs: 0

                        },

                        events: {

                            onReady:
                                onPlayerReady,

                            onStateChange:
                                onPlayerStateChange,

                            onError:
                                onPlayerError

                        }

                    }
                );

        }


        /* =====================================================
           PLAYER PRONTO
        ===================================================== */

        function onPlayerReady() {

            youtubeReady = true;


            /*
             * Configuração inicial.
             */

            youtubePlayer.mute();


            youtubePlayer.setVolume(0);


            /*
             * Atualiza título.
             */

            updateTitle();


            /*
             * Se o usuário já iniciou,
             * começa imediatamente.
             */

            if (panelActive) {

                playCurrentVideo();

            }

        }


        /* =====================================================
           ESTADO DO PLAYER
        ===================================================== */

        function onPlayerStateChange(event) {

            /*
             * 0 = ENDED
             *
             * Este é o ponto importante:
             * não usamos mais nenhum cronômetro.
             */

            if (
                event.data ===
                YT.PlayerState.ENDED
            ) {

                nextVideo();

            }


            /*
             * Quando começa a tocar,
             * garantimos que continua mudo.
             */

            if (
                event.data ===
                YT.PlayerState.PLAYING
            ) {

                youtubePlayer.mute();

            }

        }


        /* =====================================================
           ERRO DO PLAYER
        ===================================================== */

        function onPlayerError(event) {

            console.error(
                "Erro YouTube:",
                event.data
            );


            /*
             * Tenta o próximo vídeo para que a TV
             * nunca fique parada.
             */

            setTimeout(
                () => {

                    nextVideo();

                },
                1500
            );

        }


        /* =====================================================
           INICIA PAINEL
        ===================================================== */

        async function startPanel() {

            if (panelActive) {
                return;
            }


            panelActive = true;


            overlay.style.display =
                "none";


            /*
             * Tenta colocar a página inteira
             * em fullscreen.
             */

            try {

                if (
                    !document.fullscreenElement &&
                    document.documentElement
                        .requestFullscreen
                ) {

                    await
                        document.documentElement
                            .requestFullscreen();

                }

            } catch (error) {

                console.warn(
                    "Fullscreen não disponível:",
                    error
                );

            }


            /*
             * Player já pronto.
             */

            if (youtubeReady) {

                playCurrentVideo();

            }

        }


        /* =====================================================
           REPRODUZ VÍDEO ATUAL
        ===================================================== */

        function playCurrentVideo() {

            if (!youtubeReady) {
                return;
            }


            const video =
                playlist[currentIndex];


            updateTitle();


            changingVideo = true;


            /*
             * Mudo.
             */

            youtubePlayer.mute();


            /*
             * Carrega exatamente o ID.
             */

            youtubePlayer.loadVideoById(
                video.id
            );


            /*
             * Garante autoplay.
             */

            youtubePlayer.playVideo();


            setTimeout(
                () => {

                    changingVideo = false;

                },
                500
            );

        }


        /* =====================================================
           PRÓXIMO VÍDEO
        ===================================================== */

        function nextVideo() {

            if (changingVideo) {
                return;
            }


            currentIndex =
                currentIndex + 1;


            /*
             * Loop infinito.
             */

            if (
                currentIndex >=
                playlist.length
            ) {

                currentIndex = 0;

            }


            playCurrentVideo();

        }


        /* =====================================================
           VÍDEO ANTERIOR
        ===================================================== */

        function previousVideo() {

            if (changingVideo) {
                return;
            }


            currentIndex =
                currentIndex - 1;


            if (
                currentIndex < 0
            ) {

                currentIndex =
                    playlist.length - 1;

            }


            playCurrentVideo();

        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        function updateTitle() {

            titleDisplay.textContent =
                playlist[currentIndex]
                    .title;

        }


        /* =====================================================
           RELÓGIO
        ===================================================== */

        function updateClock() {

            const now =
                new Date();


            const date =
                now
                    .toLocaleDateString(
                        "pt-BR",
                        {
                            day:
                                "2-digit",

                            month:
                                "short",

                            year:
                                "numeric"
                        }
                    )
                    .replace(
                        ".",
                        ""
                    );


            const time =
                now
                    .toLocaleTimeString(
                        "pt-BR",
                        {
                            hour:
                                "2-digit",

                            minute:
                                "2-digit",

                            second:
                                "2-digit"
                        }
                    );


            clockDisplay.textContent =
                `${date} - ${time}`;

        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );


        /* =====================================================
           CONTROLE REMOTO
        ===================================================== */

        window.addEventListener(
            "keydown",
            event => {

                /*
                 * ENTER / OK
                 */

                if (
                    !panelActive &&
                    (
                        event.key === "Enter" ||
                        event.key === " " ||
                        event.key === "MediaPlay"
                    )
                ) {

                    event.preventDefault();

                    startPanel();

                    return;

                }


                /*
                 * PRÓXIMO
                 */

                if (
                    event.key === "ArrowRight" ||
                    event.key === "MediaTrackNext"
                ) {

                    event.preventDefault();

                    nextVideo();

                    return;

                }


                /*
                 * ANTERIOR
                 */

                if (
                    event.key === "ArrowLeft" ||
                    event.key === "MediaTrackPrevious"
                ) {

                    event.preventDefault();

                    previousVideo();

                    return;

                }

            }
        );


        /* =====================================================
           BLOQUEIOS PARA TV
        ===================================================== */

        document.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

            }
        );


        document.addEventListener(
            "dragstart",
            event => {

                event.preventDefault();

            }
        );

    </script>

</body>

</html>
