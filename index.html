<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel TV</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #fff;
        }


        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .header {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 8vh;

            z-index: 100;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 0 2vw;

            background:
                linear-gradient(
                    to bottom,
                    rgba(17, 24, 39, .97),
                    rgba(0, 0, 0, .88)
                );

            border-bottom:
                2px solid
                rgba(255,255,255,.08);

            pointer-events: none;
        }


        #videoTitle {

            margin: 0;

            max-width: 70vw;

            font-size:
                clamp(
                    18px,
                    2.2vw,
                    38px
                );

            font-weight: 700;

            color: #fff;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.8);
        }


        #clockDisplay {

            font-size:
                clamp(
                    14px,
                    1.5vw,
                    26px
                );

            font-weight: 600;

            color: #ddd;

            white-space: nowrap;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.8);
        }


        /* =====================================================
           ÁREA DO PLAYER
        ===================================================== */

        .video-area {

            position: fixed;

            left: 0;
            bottom: 0;

            width: 100vw;
            height: 92vh;

            background: #000;

            overflow: hidden;
        }


        #playerContainer {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #000;
        }


        #playerContainer iframe {

            position: absolute;

            top: 0;
            left: 0;

            width: 100% !important;
            height: 100% !important;

            border: 0;

            display: block;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        #status {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index: 200;

            display: none;

            padding:
                18px 28px;

            border-radius: 10px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .85
                );

            text-align: center;

            font-size: 20px;
        }


        /* =====================================================
           TELA INICIAL
        ===================================================== */

        #startOverlay {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px;

            cursor: pointer;

            background:
                radial-gradient(
                    circle at center,
                    #111827 0%,
                    #030712 70%,
                    #000 100%
                );
        }


        #startOverlay h1 {

            margin:
                0 0 20px;

            font-size:
                clamp(
                    28px,
                    4vw,
                    60px
                );
        }


        #startOverlay p {

            margin: 0;

            color: #9ca3af;

            font-size:
                clamp(
                    15px,
                    1.8vw,
                    26px
                );
        }


    </style>

</head>


<body>


    <!-- =====================================================
         CABEÇALHO
    ===================================================== -->

    <header class="header">

        <h1 id="videoTitle">
            Painel TV
        </h1>


        <div id="clockDisplay">
            --/--/---- --:--:--
        </div>

    </header>


    <!-- =====================================================
         PLAYER
    ===================================================== -->

    <main class="video-area">

        <div id="playerContainer"></div>

    </main>


    <!-- =====================================================
         STATUS
    ===================================================== -->

    <div id="status">
        Carregando vídeo...
    </div>


    <!-- =====================================================
         TELA INICIAL
    ===================================================== -->

    <div
        id="startOverlay"
        onclick="startPanel()"
    >

        <h1>
            Painel TV Preparado
        </h1>

        <p>
            Clique aqui ou aperte OK no controle para iniciar
        </p>

    </div>


    <!-- =====================================================
         API YOUTUBE
    ===================================================== -->

    <script src="https://www.youtube.com/iframe_api"></script>


    <script>

        /* =====================================================
           PLAYLIST
        ===================================================== */

        const playlist = [

            {
                id: "-ZzPAr-u9Go",
                title: "Active_Drop"
            },

            {
                id: "E2jAXTyP3pU",
                title: "V1_ESP"
            },

            {
                id: "KaV5f_LuAOs",
                title: "V2_ESP"
            },

            {
                id: "bTioQpmxjfI",
                title: "V3_ESP"
            }

        ];


        /* =====================================================
           VARIÁVEIS
        ===================================================== */

        let player = null;

        let playerReady = false;

        let panelStarted = false;

        let currentIndex = 0;

        let changing = false;

        let youtubeApiReady = false;


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const title =
            document.getElementById(
                "videoTitle"
            );


        const clock =
            document.getElementById(
                "clockDisplay"
            );


        const overlay =
            document.getElementById(
                "startOverlay"
            );


        const status =
            document.getElementById(
                "status"
            );


        const playerContainer =
            document.getElementById(
                "playerContainer"
            );


        /* =====================================================
           API YOUTUBE PRONTA
        ===================================================== */

        function onYouTubeIframeAPIReady() {

            youtubeApiReady = true;

            console.log(
                "YouTube IFrame API carregada."
            );

        }


        /* =====================================================
           MONTA URL DO YOUTUBE
        ===================================================== */

        function buildYouTubeURL(index) {

            const current =
                playlist[index].id;


            /*
             * Os vídeos seguintes entram
             * na playlist do próprio YouTube.
             *
             * O vídeo atual fica no caminho
             * /embed/ID
             */

            const followingVideos = [];


            for (
                let i = 1;
                i < playlist.length;
                i++
            ) {

                const nextIndex =
                    (index + i) %
                    playlist.length;


                followingVideos.push(
                    playlist[nextIndex].id
                );

            }


            const params = new URLSearchParams({

                autoplay: "1",

                controls: "0",

                disablekb: "1",

                fs: "0",

                playsinline: "1",

                rel: "0",

                loop: "1",

                mute: "0",

                playlist:
                    followingVideos.join(","),

                enablejsapi: "1"

            });


            /*
             * Se estiver hospedado em HTTP/HTTPS,
             * envia o origin para a API.
             *
             * Em arquivo local (file://), não
             * adicionamos origin.
             */

            if (
                location.protocol === "http:" ||
                location.protocol === "https:"
            ) {

                params.set(
                    "origin",
                    location.origin
                );

            }


            return (
                "https://www.youtube.com/embed/" +
                current +
                "?" +
                params.toString()
            );

        }


        /* =====================================================
           CRIA IFRAME
        ===================================================== */

        function createVideoIframe() {

            playerReady = false;


            playerContainer.innerHTML = "";


            const iframe =
                document.createElement(
                    "iframe"
                );


            iframe.id =
                "youtubePlayer";


            iframe.src =
                buildYouTubeURL(
                    currentIndex
                );


            iframe.title =
                "Painel TV";


            iframe.allow =
                "autoplay; encrypted-media; fullscreen; picture-in-picture";


            iframe.allowFullscreen =
                true;


            iframe.setAttribute(
                "frameborder",
                "0"
            );


            iframe.setAttribute(
                "referrerpolicy",
                "strict-origin-when-cross-origin"
            );


            playerContainer.appendChild(
                iframe
            );


            /*
             * O iframe já é o player funcional.
             *
             * Agora tentamos conectar a API
             * a ele para obter controle avançado.
             */

            if (youtubeApiReady) {

                attachYouTubeAPI(
                    iframe
                );

            }

        }


        /* =====================================================
           CONECTA API AO IFRAME JÁ EXISTENTE
        ===================================================== */

        function attachYouTubeAPI(
            iframe
        ) {

            try {

                player =
                    new YT.Player(
                        iframe,
                        {

                            events: {

                                onReady:
                                    onPlayerReady,

                                onStateChange:
                                    onPlayerStateChange,

                                onError:
                                    onPlayerError

                            }

                        }
                    );

            } catch (error) {

                console.warn(
                    "Não foi possível conectar a API do YouTube.",
                    error
                );

                /*
                 * Isso NÃO impede o vídeo.
                 *
                 * O iframe continua funcionando
                 * diretamente.
                 */

                player = null;

            }

        }


        /* =====================================================
           PLAYER PRONTO
        ===================================================== */

        function onPlayerReady() {

            playerReady = true;


            updateTitle();


            hideStatus();


            /*
             * O iframe já recebeu autoplay=1.
             *
             * Mesmo assim tentamos garantir
             * reprodução e volume.
             */

            try {

                player.unMute();

                player.setVolume(100);

                player.playVideo();

            } catch (error) {

                console.log(
                    "Comandos iniciais não disponíveis.",
                    error
                );

            }

        }


        /* =====================================================
           INICIAR PAINEL
        ===================================================== */

        async function startPanel() {

            if (panelStarted) {
                return;
            }


            panelStarted = true;


            /*
             * Remove tela inicial.
             */

            overlay.style.display =
                "none";


            /*
             * Mostra status enquanto
             * o iframe é carregado.
             */

            showStatus(
                "Carregando vídeo..."
            );


            /*
             * Tenta colocar em fullscreen.
             *
             * Falha não impede o funcionamento.
             */

            try {

                if (
                    document.documentElement
                        .requestFullscreen
                ) {

                    await
                        document.documentElement
                            .requestFullscreen();

                }

            } catch (error) {

                console.log(
                    "Fullscreen não disponível."
                );

            }


            /*
             * CRIA O IFRAME SOMENTE AGORA.
             *
             * Esse é o ponto principal da correção.
             */

            createVideoIframe();


            updateTitle();


            /*
             * Fallback:
             *
             * Se a API não conectar por alguma
             * particularidade do navegador da TV,
             * o iframe continua sendo reproduzido.
             */

            setTimeout(
                () => {

                    hideStatus();

                },
                5000
            );

        }


        /* =====================================================
           ESTADO DO PLAYER
        ===================================================== */

        function onPlayerStateChange(event) {

            /*
             * PLAYING
             */

            if (
                event.data ===
                YT.PlayerState.PLAYING
            ) {

                hideStatus();


                /*
                 * Descobre qual vídeo da playlist
                 * o YouTube está executando.
                 */

                try {

                    const playlistIndex =
                        player.getPlaylistIndex();


                    if (
                        typeof playlistIndex ===
                        "number" &&
                        playlistIndex >= 0
                    ) {

                        currentIndex =
                            playlistIndex;

                        updateTitle();

                    }

                } catch (error) {

                    console.log(
                        "Não foi possível obter índice.",
                        error
                    );

                }


                /*
                 * Garante o som.
                 */

                try {

                    player.unMute();

                    player.setVolume(100);

                } catch (error) {

                    console.log(
                        "Não foi possível ajustar volume.",
                        error
                    );

                }

            }


            /*
             * BUFFERING
             */

            if (
                event.data ===
                YT.PlayerState.BUFFERING
            ) {

                showStatus(
                    "Carregando vídeo..."
                );

            }


            /*
             * CUED
             */

            if (
                event.data ===
                YT.PlayerState.CUED
            ) {

                hideStatus();

            }


            /*
             * ENDED
             *
             * Normalmente não precisaremos
             * tratar aqui porque o próprio
             * playlist + loop do YouTube
             * fará a sequência.
             */

            if (
                event.data ===
                YT.PlayerState.ENDED
            ) {

                console.log(
                    "Playlist chegou ao fim."
                );

            }

        }


        /* =====================================================
           PRÓXIMO
        ===================================================== */

        function nextVideo() {

            if (!panelStarted) {
                return;
            }


            if (changing) {
                return;
            }


            changing = true;


            currentIndex++;


            if (
                currentIndex >=
                playlist.length
            ) {

                currentIndex = 0;

            }


            updateTitle();


            /*
             * Se a API estiver funcionando,
             * usa a troca interna do YouTube.
             */

            if (
                playerReady &&
                player
            ) {

                try {

                    player.playVideoAt(
                        currentIndex
                    );


                    setTimeout(
                        () => {

                            changing = false;

                        },
                        700
                    );


                    return;

                } catch (error) {

                    console.warn(
                        "Falha no playVideoAt.",
                        error
                    );

                }

            }


            /*
             * Fallback:
             * recria o iframe diretamente.
             */

            recreateIframe();

        }


        /* =====================================================
           ANTERIOR
        ===================================================== */

        function previousVideo() {

            if (!panelStarted) {
                return;
            }


            if (changing) {
                return;
            }


            changing = true;


            currentIndex--;


            if (
                currentIndex < 0
            ) {

                currentIndex =
                    playlist.length - 1;

            }


            updateTitle();


            /*
             * A API não possui uma navegação
             * anterior realmente confiável em
             * todos os ambientes.
             *
             * Então reconstruímos o iframe.
             */

            recreateIframe();

        }


        /* =====================================================
           RECRIA IFRAME
        ===================================================== */

        function recreateIframe() {

            player = null;

            playerReady = false;


            showStatus(
                "Carregando vídeo..."
            );


            createVideoIframe();


            updateTitle();


            setTimeout(
                () => {

                    hideStatus();


                    changing = false;

                },
                1200
            );

        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        function updateTitle() {

            title.textContent =
                playlist[currentIndex]
                    .title;

        }


        /* =====================================================
           ERRO
        ===================================================== */

        function onPlayerError(event) {

            console.error(
                "Erro do YouTube:",
                event.data
            );


            /*
             * Não deixa a TV parada.
             */

            setTimeout(
                () => {

                    nextVideo();

                },
                1500
            );

        }


        /* =====================================================
           STATUS
        ===================================================== */

        function showStatus(
            message
        ) {

            status.textContent =
                message;

            status.style.display =
                "block";

        }


        function hideStatus() {

            status.style.display =
                "none";

        }


        /* =====================================================
           RELÓGIO
        ===================================================== */

        function updateClock() {

            const now =
                new Date();


            const date =
                now
                    .toLocaleDateString(
                        "pt-BR",
                        {
                            day: "2-digit",
                            month: "short",
                            year: "numeric"
                        }
                    )
                    .replace(
                        ".",
                        ""
                    );


            const time =
                now
                    .toLocaleTimeString(
                        "pt-BR",
                        {
                            hour: "2-digit",
                            minute: "2-digit",
                            second: "2-digit"
                        }
                    );


            clock.textContent =
                `${date} - ${time}`;

        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );


        /* =====================================================
           CONTROLE REMOTO
        ===================================================== */

        window.addEventListener(
            "keydown",
            event => {

                /*
                 * ENTER / OK
                 */

                if (
                    !panelStarted &&
                    (
                        event.key === "Enter" ||
                        event.key === " " ||
                        event.key === "NumpadEnter"
                    )
                ) {

                    event.preventDefault();

                    startPanel();

                    return;

                }


                /*
                 * PRÓXIMO
                 */

                if (
                    event.key === "ArrowRight" ||
                    event.key === "PageDown" ||
                    event.key === "MediaTrackNext"
                ) {

                    event.preventDefault();

                    nextVideo();

                    return;

                }


                /*
                 * ANTERIOR
                 */

                if (
                    event.key === "ArrowLeft" ||
                    event.key === "PageUp" ||
                    event.key === "MediaTrackPrevious"
                ) {

                    event.preventDefault();

                    previousVideo();

                    return;

                }

            }
        );


        /* =====================================================
           PROTEÇÕES
        ===================================================== */

        document.addEventListener(
            "contextmenu",
            event =>
                event.preventDefault()
        );


        document.addEventListener(
            "dragstart",
            event =>
                event.preventDefault()
        );


    </script>

</body>

</html>
